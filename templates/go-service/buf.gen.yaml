version: v2
managed:
  enabled: false
plugins:
  - local: .tools/bin/protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: .tools/bin/protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
  - local: .tools/bin/protoc-gen-grpc-gateway
    out: gen
    opt:
      - paths=source_relative
      - generate_unbound_methods=false
  - local: .tools/bin/protoc-gen-openapiv2
    out: gen/openapiv2
    opt:
      - allow_merge=false
      - disable_default_errors=true
      - generate_unbound_methods=false
      - json_names_for_fields=true
      - use_go_templates=false
