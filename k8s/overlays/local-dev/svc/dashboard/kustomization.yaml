apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-dev-all
namePrefix: local-dev-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: local-dev
resources:
  - ../../../../apps/svc/dashboard/base
images:
  - name: insurance-hub-dashboard-api
    newName: insurance-hub-dashboard-api
    newTag: 1.0.0-local.7091b35cae12
configMapGenerator:
  - name: dashboard-config
    behavior: merge
    literals:
      - DEPLOYMENT_ENVIRONMENT=local-dev
      - SERVICE_VERSION=git-7091b35cae12
      - ELASTICSEARCH_URL=http://local-dev-elasticsearch-es-http.local-dev-all.svc:9200
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: dashboard-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: dashboard-api
  - path: event-enabled-config-patch.yaml
    target:
      kind: ConfigMap
      name: dashboard-config
  - path: event-enabled-deployment-patch.yaml
    target:
      kind: Deployment
      name: dashboard-api
  - path: event-enabled-network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: dashboard-api
replacements:
  - source:
      kind: ConfigMap
      name: dashboard-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: dashboard-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
