apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-dev-all
namePrefix: local-dev-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: local-dev
resources:
  - ../../../../apps/svc/chat/base
images:
  - name: insurance-hub-chat-api
    newName: insurance-hub-chat-api
    newTag: 1.0.0-local.1a5c95f7e8d5
configMapGenerator:
  - name: chat-config
    behavior: merge
    literals:
      - DEPLOYMENT_ENVIRONMENT=local-dev
      - SERVICE_VERSION=git-1a5c95f7e8d5
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: chat-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: chat-api
replacements:
  - source:
      kind: ConfigMap
      name: chat-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: chat-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
