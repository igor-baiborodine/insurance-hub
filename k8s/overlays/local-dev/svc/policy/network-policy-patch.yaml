apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-api
spec:
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              cnpg.io/cluster: local-dev-postgres-policy
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              app.kubernetes.io/name: product-api
              app.kubernetes.io/component: api
      ports:
        - port: 9090
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pricing-api
              app.kubernetes.io/component: api
      ports:
        - port: 9090
          protocol: TCP
