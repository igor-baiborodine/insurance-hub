apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-dev-all
namePrefix: local-dev-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: local-dev
resources:
  - ../../../../apps/svc/product/base
images:
  - name: insurance-hub-product-api
    newName: insurance-hub-product-api
    newTag: 1.10.0-local.ff52ab5655e3
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: product-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: product-api
