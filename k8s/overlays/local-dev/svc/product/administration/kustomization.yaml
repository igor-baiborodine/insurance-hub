apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-dev-all
namePrefix: local-dev-
labels:
  - includeSelectors: true
    pairs:
      environment: local-dev
resources:
  - ../../../../../apps/svc/product/base/administration
images:
  - name: insurance-hub-product-api
    newName: insurance-hub-product-api
    newTag: 1.10.0-local.ff52ab5655e3
patches:
  - path: job-patch.yaml
    target:
      kind: Job
      name: product-init
