apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-search-api
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              strimzi.io/cluster: local-dev-kafka
              strimzi.io/component-type: kafka
      ports:
        - port: 9093
          protocol: TCP
