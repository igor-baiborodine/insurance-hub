- op: add
  path: /spec/egress/-
  value:
    to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: local-dev-all
        podSelector:
          matchLabels:
            strimzi.io/cluster: local-dev-kafka
            strimzi.io/component-type: kafka
    ports:
      - port: 9093
        protocol: TCP
