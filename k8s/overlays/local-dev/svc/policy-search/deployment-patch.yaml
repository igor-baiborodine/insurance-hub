apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-search-api
spec:
  template:
    spec:
      containers:
        - name: policy-search-api
          imagePullPolicy: Never
          env:
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: local-dev-policy-search-elasticsearch
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: local-dev-policy-search-elasticsearch
                  key: password
            - name: ELASTICSEARCH_WRITER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: local-dev-policy-search-elasticsearch-writer
                  key: username
            - name: ELASTICSEARCH_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: local-dev-policy-search-elasticsearch-writer
                  key: password
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/policy-search/kafka
              readOnly: true
      volumes:
        - name: kafka-ca
          secret:
            secretName: local-dev-policy-search-kafka-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 292
