apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-search-api
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              elasticsearch.k8s.elastic.co/cluster-name: local-dev-elasticsearch
      ports:
        - port: 9200
          protocol: TCP
