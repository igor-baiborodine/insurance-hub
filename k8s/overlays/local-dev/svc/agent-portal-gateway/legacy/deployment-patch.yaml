apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-portal-gateway-legacy
  labels:
    environment: local-dev
spec:
  template:
    metadata:
      labels:
        environment: local-dev
    spec:
      containers:
        - name: agent-portal-gateway-legacy
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 300m
              memory: 768Mi
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: "local-dev"
            - name: MICRONAUT_CONFIG_FILES
              value: /etc/product-route/application.yml
            - name: TRACING_ZIPKIN_ENABLED
              value: "false"
          volumeMounts:
            - name: product-route-config
              mountPath: /etc/product-route
              readOnly: true
      volumes:
        - name: product-route-config
          configMap:
            name: gateway-product-route-config
