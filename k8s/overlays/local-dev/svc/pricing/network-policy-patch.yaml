apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pricing-api
spec:
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              cnpg.io/cluster: local-dev-postgres-pricing
      ports:
        - port: 5432
          protocol: TCP
