apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pricing-api
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: policy-api-legacy
              app.kubernetes.io/component: api
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: policy-api
              app.kubernetes.io/component: api
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              cnpg.io/cluster: local-dev-postgres-pricing
      ports:
        - port: 5432
          protocol: TCP
