apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: document-api
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              insurance-hub.io/document-qualification-client: "true"
      ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-all
          podSelector:
            matchLabels:
              cnpg.io/cluster: local-dev-postgres-document
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: local-dev-minio-document
      ports:
        - port: 9000
          protocol: TCP
