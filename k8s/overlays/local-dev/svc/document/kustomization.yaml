apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: local-dev-all
namePrefix: local-dev-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: local-dev
resources:
  - ../../../../apps/svc/document/base
images:
  - name: insurance-hub-document-api
    newName: insurance-hub-document-api
    newTag: 1.0.0-local.0e53205ebf0b
configMapGenerator:
  - name: document-config
    behavior: merge
    literals:
      - DEPLOYMENT_ENVIRONMENT=local-dev
      - SERVICE_VERSION=git-0e53205ebf0b
      - EVENT_WORKERS_ENABLED=true
      - KAFKA_BROKERS=local-dev-kafka-kafka-bootstrap:9093
      - KAFKA_GROUP=documents-service
      - KAFKA_REGISTERED_TOPIC=policy-registered
      - KAFKA_CA_FILE=/etc/document-service/kafka/ca.crt
      - JSREPORT_URL=http://local-dev-jsreport.local-dev-all.svc.cluster.local:5488
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: document-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: document-api
replacements:
  - source:
      kind: ConfigMap
      name: document-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: document-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
