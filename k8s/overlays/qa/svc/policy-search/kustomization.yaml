apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/policy-search/base
images:
  - name: insurance-hub-policy-search-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/policy-search-api
    newTag: 1.4.0
configMapGenerator:
  - name: policy-search-config
    behavior: merge
    literals:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://qa-alloy.qa-monitoring.svc.cluster.local:4317
      - ELASTICSEARCH_URL=https://qa-elasticsearch-es-http.qa-data.svc:9200
      - ELASTICSEARCH_CA_FILE=/etc/policy-search/elasticsearch/ca.crt
      - DEPLOYMENT_ENVIRONMENT=qa
      - SERVICE_VERSION=git-dfa4cb1a35c1
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: policy-search-api
  - path: event-config-patch.yaml
    target:
      kind: ConfigMap
      name: policy-search-config
  - path: event-deployment-patch.yaml
    target:
      kind: Deployment
      name: policy-search-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: policy-search-api
  - path: event-network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: policy-search-api
replacements:
  - source:
      kind: ConfigMap
      name: policy-search-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: policy-search-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
