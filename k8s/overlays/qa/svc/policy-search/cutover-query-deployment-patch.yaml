apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-search-api
spec:
  template:
    spec:
      containers:
        - name: policy-search-api
          env:
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qa-policy-search-cutover-elasticsearch
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qa-policy-search-cutover-elasticsearch
                  key: password
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /etc/policy-search/elasticsearch
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: qa-policy-search-cutover-elasticsearch-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 292
