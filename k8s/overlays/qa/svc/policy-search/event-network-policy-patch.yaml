apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-search-api
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-data
          podSelector:
            matchLabels:
              strimzi.io/cluster: qa-kafka
              strimzi.io/component-type: kafka
      ports:
        - port: 9093
          protocol: TCP
