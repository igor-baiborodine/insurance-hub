apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-api
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-svc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: web-vue-legacy
              app.kubernetes.io/instance: insurance-hub-web-vue-legacy
              app.kubernetes.io/component: web
              environment: qa
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: qa-alloy
      ports:
        - port: 4317
          protocol: TCP
