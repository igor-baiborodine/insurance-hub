apiVersion: batch/v1
kind: Job
metadata:
  name: pricing-init
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          args:
            - --operation=migrate
            - --environment=qa
            - --context=qa-insurance-hub
            - --target-file=/etc/pricing-admin/target/target.json
            - --database-url-file=/etc/pricing-admin/migrator/database-url
            - --ca-file=/etc/pricing-admin/migrator/ca.crt
            - --timeout=${MIGRATION_TIMEOUT}
      containers:
        - name: seed
          args:
            - --environment=qa
            - --context=qa-insurance-hub
            - --target-file=/etc/pricing-admin/target/target.json
            - --database-url-file=/etc/pricing-admin/seeder/database-url
            - --ca-file=/etc/pricing-admin/seeder/ca.crt
      volumes:
        - name: target
          secret:
            secretName: qa-postgres-pricing-admin-target
        - name: migrator
          secret:
            secretName: qa-postgres-pricing-migrator-creds
        - name: seeder
          secret:
            secretName: qa-postgres-pricing-seeder-creds
