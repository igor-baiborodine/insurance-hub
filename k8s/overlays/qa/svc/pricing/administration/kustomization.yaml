apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: true
    pairs:
      environment: qa
resources:
  - ../../../../../apps/svc/pricing/base/administration
images:
  - name: insurance-hub-pricing-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/pricing-api
    newTag: ${PRICING_SERVICE_VERSION}
patches:
  - path: job-patch.yaml
    target:
      kind: Job
      name: pricing-init
