apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: true
    pairs:
      environment: qa
resources:
  - ../../../../../apps/svc/product/base/administration
images:
  - name: insurance-hub-product-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/product-api
    newTag: 1.10.0
patches:
  - path: job-patch.yaml
    target:
      kind: Job
      name: product-init
