apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-api
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-svc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-portal-gateway-legacy
              app.kubernetes.io/instance: insurance-hub-agent-portal-gateway-legacy
              app.kubernetes.io/component: gateway
              environment: qa
              insurance-hub.io/product-business-client: "true"
      ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-data
          podSelector:
            matchLabels:
              cnpg.io/cluster: qa-postgres-product
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: qa-alloy
      ports:
        - port: 4317
          protocol: TCP
