apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
spec:
  template:
    metadata:
      annotations:
        insurance-hub.io/product-configuration-revision: "step15-20261014T205114Z"
    spec:
      containers:
        - name: product-api
          imagePullPolicy: Always
          env:
            - name: PRODUCT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qa-postgres-product-reader-creds
                  key: database-url
      volumes:
        - name: postgres-ca
          secret:
            secretName: qa-postgres-product-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
