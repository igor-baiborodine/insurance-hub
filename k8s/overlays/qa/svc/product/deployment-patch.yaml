apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-api
  labels:
    app.kubernetes.io/version: "sha-be510cc"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/version: "sha-be510cc"
      annotations:
        insurance-hub.io/product-configuration-revision: "step15-reader-rotation-20261014T210228Z"
    spec:
      containers:
        - name: product-api
          imagePullPolicy: Always
          env:
            - name: PRODUCT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qa-postgres-product-reader-creds
                  key: database-url
            - name: SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
      volumes:
        - name: postgres-ca
          secret:
            secretName: qa-postgres-product-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
