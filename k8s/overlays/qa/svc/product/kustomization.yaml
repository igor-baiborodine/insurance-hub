apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/product/base
images:
  - name: insurance-hub-product-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/product-api
    newTag: 1.3.0
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: product-api
