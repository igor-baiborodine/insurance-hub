apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/product/base
images:
  - name: insurance-hub-product-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/product-api
    newTag: ${PRODUCT_SERVICE_VERSION}
configMapGenerator:
  - name: product-config
    behavior: merge
    literals:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://qa-alloy.qa-monitoring.svc.cluster.local:4317
      - OTEL_EXPORTER_OTLP_TIMEOUT=2s
      - DEPLOYMENT_ENVIRONMENT=qa
      - SERVICE_VERSION=${PRODUCT_SERVICE_VERSION}
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: product-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: product-api
replacements:
  - source:
      kind: ConfigMap
      name: product-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: product-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
