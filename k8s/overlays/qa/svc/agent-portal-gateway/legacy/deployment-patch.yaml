apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-portal-gateway-legacy
  labels:
    environment: qa
    app.kubernetes.io/version: "1.3.0"
spec:
  template:
    metadata:
      labels:
        environment: qa
        app.kubernetes.io/version: "1.3.0"
    spec:
      containers:
        - name: agent-portal-gateway-legacy
          image: ghcr.io/igor-baiborodine/insurance-hub/agent-portal-gateway-legacy:1.3.0
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 300m
              memory: 768Mi
          env:
            - name: MICRONAUT_ENVIRONMENTS
              value: "qa"
            - name: MICRONAUT_CONFIG_FILES
              value: /etc/product-route/application.yml
            - name: TRACING_ZIPKIN_HTTP_URL
              value: "http://qa-alloy.qa-monitoring.svc.cluster.local:9411"
            - name: TRACING_ZIPKIN_SAMPLER_PROBABILITY
              value: "1.0"
          volumeMounts:
            - name: product-route-config
              mountPath: /etc/product-route
              readOnly: true
      volumes:
        - name: product-route-config
          configMap:
            name: gateway-product-route-config
