apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-api
spec:
  template:
    metadata:
      annotations:
        insurance-hub.io/document-reader-credential-revision: "1"
    spec:
      containers:
        - name: document-api
          imagePullPolicy: Always
          env:
            - name: DOCUMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qa-postgres-document-reader-creds
                  key: database-url
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-reader-creds
                  key: endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-reader-creds
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-reader-creds
                  key: secret-key
      volumes:
        - name: postgres-ca
          secret:
            secretName: qa-postgres-document-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
        - name: minio-ca
          secret:
            secretName: qa-minio-document-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
