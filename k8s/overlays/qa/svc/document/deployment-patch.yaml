apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-api
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    metadata:
      annotations:
        insurance-hub.io/document-reader-credential-revision: "1"
        insurance-hub.io/document-writer-credential-revision: "1"
    spec:
      containers:
        - name: document-api
          imagePullPolicy: Always
          env:
            - name: DOCUMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qa-postgres-document-reader-creds
                  key: database-url
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-reader-creds
                  key: endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-reader-creds
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-reader-creds
                  key: secret-key
            - name: DOCUMENT_WRITER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qa-postgres-document-writer-creds
                  key: database-url
            - name: MINIO_WRITER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-writer-creds
                  key: access-key
            - name: MINIO_WRITER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-document-writer-creds
                  key: secret-key
          volumeMounts:
            - name: postgres-writer-ca
              mountPath: /etc/document-service/postgres-writer
              readOnly: true
            - name: kafka-ca
              mountPath: /etc/document-service/kafka
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: qa-postgres-document-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
        - name: minio-ca
          secret:
            secretName: qa-minio-document-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
        - name: postgres-writer-ca
          secret:
            secretName: qa-postgres-document-writer-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 292
        - name: kafka-ca
          secret:
            secretName: qa-document-kafka-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 292
