apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/document/base
images:
  - name: insurance-hub-document-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/document-api
    newTag: 1.0.0
configMapGenerator:
  - name: document-config
    behavior: merge
    literals:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://qa-alloy.qa-monitoring.svc.cluster.local:4317
      - DEPLOYMENT_ENVIRONMENT=qa
      - SERVICE_VERSION=git-2f0bc5dd8bb7
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: document-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: document-api
replacements:
  - source:
      kind: ConfigMap
      name: document-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: document-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
