apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/document/base
images:
  - name: insurance-hub-document-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/document-api
    newTag: 1.5.0
configMapGenerator:
  - name: document-config
    behavior: merge
    literals:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://qa-alloy.qa-monitoring.svc.cluster.local:4317
      - DEPLOYMENT_ENVIRONMENT=qa
      - SERVICE_VERSION=git-67605913fec9
      - MINIO_CA_FILE=/etc/document-service/minio/ca.crt
      - EVENT_WORKERS_ENABLED=true
      - KAFKA_BROKERS=qa-kafka-kafka-bootstrap.qa-data.svc:9093
      - KAFKA_GROUP=documents-service
      - KAFKA_REGISTERED_TOPIC=policy-registered
      - KAFKA_CA_FILE=/etc/document-service/kafka/ca.crt
      - JSREPORT_URL=http://qa-jsreport.qa-svc.svc.cluster.local:5488
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: document-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: document-api
replacements:
  - source:
      kind: ConfigMap
      name: document-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: document-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
