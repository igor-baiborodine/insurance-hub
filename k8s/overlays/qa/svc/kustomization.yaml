apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./jsreport
  - ./agent-portal-gateway/legacy
  - ./auth/legacy
  - ./chat/legacy
  - ./dashboard/legacy
  - ./document/legacy
  - ./payment/legacy
  - ./policy/legacy
  - ./policy-search/legacy
  - ./pricing/legacy
  - ./product/legacy
  - ./web-vue/legacy
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=product-api-legacy
    patch: |-
      - op: add
        path: /metadata/labels/insurance-hub.io~1product-go-state
        value: stopped
