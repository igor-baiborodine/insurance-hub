apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/payment/base
images:
  - name: insurance-hub-payment-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/payment-api
    newTag: 1.0.0
    digest: sha256:845c56f9e27f932652f8a26d68e1b477985eff5ff159303deef3efeebd955dab
configMapGenerator:
  - name: payment-config
    behavior: merge
    literals:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://qa-alloy.qa-monitoring.svc.cluster.local:4317
      - DEPLOYMENT_ENVIRONMENT=qa
      - SERVICE_VERSION=git-f52fbb20834a
      - DB_MAX_CONNS=4
      - DB_CONNECT_TIMEOUT=3s
      - DB_QUERY_TIMEOUT=1s
      - MINIO_CA_FILE=/etc/payment-service/minio/ca.crt
      - MINIO_BUCKET=payments-import
      - MINIO_FETCH_TIMEOUT=3s
      - KAFKA_BROKERS=qa-kafka-kafka-bootstrap.qa-data.svc:9093
      - KAFKA_REGISTERED_TOPIC=policy-registered
      - KAFKA_CA_FILE=/etc/payment-service/kafka/ca.crt
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: payment-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: payment-api
replacements:
  - source:
      kind: ConfigMap
      name: payment-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: payment-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
