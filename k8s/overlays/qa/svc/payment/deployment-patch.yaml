apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  template:
    spec:
      containers:
        - name: payment-api
          env:
            - name: PAYMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qa-postgres-payment-writer-creds
                  key: database-url
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: qa-minio-payment-reader-creds
                  key: endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-payment-reader-creds
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: qa-minio-payment-reader-creds
                  key: secret-key
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/payment-service/postgres
              readOnly: true
            - name: minio-ca
              mountPath: /etc/payment-service/minio
              readOnly: true
            - name: kafka-ca
              mountPath: /etc/payment-service/kafka
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: qa-postgres-payment-writer-creds
            items:
              - key: ca.crt
                path: ca.crt
        - name: minio-ca
          secret:
            secretName: qa-minio-payment-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
        - name: kafka-ca
          secret:
            secretName: qa-payment-kafka-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 292
