apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
spec:
  template:
    spec:
      containers:
        - name: dashboard-api
          imagePullPolicy: Always
          env:
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qa-dashboard-elasticsearch
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qa-dashboard-elasticsearch
                  key: password
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /etc/dashboard/elasticsearch
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: qa-dashboard-elasticsearch-ca
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 292
