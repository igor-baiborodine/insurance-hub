apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: policy-api
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: qa-alloy
      ports:
        - port: 4317
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-data
          podSelector:
            matchLabels:
              cnpg.io/cluster: qa-postgres-policy
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-svc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: product-api
              app.kubernetes.io/component: api
      ports:
        - port: 9090
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-svc
          podSelector:
            matchLabels:
              app.kubernetes.io/name: pricing-api
              app.kubernetes.io/component: api
      ports:
        - port: 9090
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: qa-data
          podSelector:
            matchLabels:
              strimzi.io/cluster: qa-kafka
              strimzi.io/component-type: kafka
      ports:
        - port: 9093
          protocol: TCP
