apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/policy/base
images:
  - name: insurance-hub-policy-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/policy-api
    newTag: 1.1.1
    digest: sha256:c2e927f584d10859783774ef0d87c31b31d2081a9781e72dc380cb5ab8eaaa0b
configMapGenerator:
  - name: policy-config
    behavior: merge
    literals:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://qa-alloy.qa-monitoring.svc.cluster.local:4317
      - DEPLOYMENT_ENVIRONMENT=qa
      - SERVICE_VERSION=git-eef48b1c9981
patches:
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: policy-api
replacements:
  - source:
      kind: ConfigMap
      name: policy-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: policy-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
