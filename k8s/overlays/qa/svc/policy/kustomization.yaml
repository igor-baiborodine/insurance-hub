apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qa-svc
namePrefix: qa-
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      environment: qa
resources:
  - ../../../../apps/svc/policy/base
images:
  - name: insurance-hub-policy-api
    newName: ghcr.io/igor-baiborodine/insurance-hub/policy-api
    newTag: 1.5.0
    digest: sha256:551475fa0370ccee1fbc57abc1d06d8ffe78447c0e929317dac9fb5e8235b086
configMapGenerator:
  - name: policy-config
    behavior: merge
    literals:
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://qa-alloy.qa-monitoring.svc.cluster.local:4317
      - DEPLOYMENT_ENVIRONMENT=qa
      - SERVICE_VERSION=git-6b004533b248
      - DB_MAX_CONNS=4
      - DB_CONNECT_TIMEOUT=3s
      - DB_QUERY_TIMEOUT=1s
      - PRODUCT_GRPC_TARGET=qa-product-api.qa-svc.svc.cluster.local:9090
      - PRICING_GRPC_TARGET=qa-pricing-api.qa-svc.svc.cluster.local:9090
      - EVENT_PUBLISHER_ENABLED=true
      - KAFKA_BROKERS=qa-kafka-kafka-bootstrap.qa-data.svc:9093
      - KAFKA_REGISTERED_TOPIC=policy-registered
      - KAFKA_TERMINATED_TOPIC=policy-terminated
      - KAFKA_CA_FILE=/etc/policy-service/kafka/ca.crt
      - KAFKA_PUBLISH_TIMEOUT=3s
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: policy-api
  - path: network-policy-patch.yaml
    target:
      kind: NetworkPolicy
      name: policy-api
replacements:
  - source:
      kind: ConfigMap
      name: policy-config
      fieldPath: data.SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          name: policy-api
        fieldPaths:
          - metadata.labels.app\.kubernetes\.io/version
          - spec.template.metadata.labels.app\.kubernetes\.io/version
        options:
          create: true
