apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-vue-product-preview
  labels:
    app.kubernetes.io/name: web-vue-product-preview
    app.kubernetes.io/instance: insurance-hub-web-vue-product-preview
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-vue-product-preview
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-vue-product-preview
        app.kubernetes.io/instance: insurance-hub-web-vue-product-preview
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web-vue-product-preview
          image: ghcr.io/igor-baiborodine/insurance-hub/web-vue-legacy@sha256:b820b4ab716cc3dafac0688274d31745ed2159ef38aa04974347baa035d41d2d
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: web-vue-product-preview-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
