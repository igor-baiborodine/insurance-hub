enabled: true

crds:
  enabled: false

kubeControllerManager:
  enabled: false

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: false
    general: true
    k8s: true
    kubeApiserver: true
    kubeApiserverAvailability: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

prometheus:
  prometheusSpec:
    retention: 10d
    # Alloy is the only intended writer for application/runtime OTLP metrics.
    # Keep Prometheus's separate native OTLP receiver disabled below.
    enableRemoteWriteReceiver: true
    enableOTLPReceiver: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector:
      matchLabels: {}
    podMonitorNamespaceSelector: {}
    podMonitorSelector:
      matchLabels: {}

grafana:
  enabled: true
  adminPassword: adminpwd
  defaultDashboardsEnabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://qa-loki:3100
      isDefault: false
      jsonData:
        maxLines: 1000
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://qa-tempo:3200
      isDefault: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      provider:
        # Repository-owned dashboards are immutable in Grafana. The sidecar
        # replaces them only when their labeled ConfigMaps change.
        disableDelete: true
        allowUiUpdates: false
  # Persist Grafana state across pod replacements. Repository dashboards are
  # also reconstructed from their sidecar ConfigMaps after a replacement.
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
