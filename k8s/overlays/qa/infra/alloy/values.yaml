controller:
  type: deployment
  replicas: 1

image:
  tag: v1.20.1

# Alloy reads Pod metadata and permitted workload logs only in qa-svc. Keep
# clusterRules empty so the chart cannot add a ClusterRole alongside these Roles.
rbac:
  namespaces:
    - qa-svc
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - ""
      resources:
        - pods/log
      verbs:
        - get
  clusterRules: []

alloy:
  # Positions and the remote-write WAL are intentionally ephemeral for this pilot.
  storagePath: /tmp/alloy
  enableHttpServerPort: true
  listenAddr: 0.0.0.0
  listenPort: 12345
  extraPorts:
    - name: zipkin
      port: 9411
      targetPort: 9411
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  configMap:
    # Owning Make targets inject config.alloy with Helm --set-file.
    create: true

service:
  enabled: true
  type: ClusterIP

serviceMonitor:
  enabled: true

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: qa-zipkin-bridge-config
      namespace: qa-monitoring
    data:
      config.yaml: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318

        processors:
          batch: {}

        exporters:
          zipkin:
            endpoint: http://qa-zipkin.qa-monitoring.svc.cluster.local:9411/api/v2/spans
            format: proto

        service:
          pipelines:
            traces:
              receivers: [otlp]
              processors: [batch]
              exporters: [zipkin]

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: qa-zipkin-bridge
      namespace: qa-monitoring
      labels:
        app.kubernetes.io/name: zipkin-bridge
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: zipkin-bridge
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zipkin-bridge
        spec:
          containers:
            - name: otelcol-contrib
              image: otel/opentelemetry-collector-contrib:0.114.0
              args:
                - --config=/etc/otelcol-contrib/config.yaml
              ports:
                - containerPort: 4317
                  name: otlp-grpc
                  protocol: TCP
                - containerPort: 4318
                  name: otlp-http
                  protocol: TCP
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - name: config
                  mountPath: /etc/otelcol-contrib
          volumes:
            - name: config
              configMap:
                name: qa-zipkin-bridge-config

  - apiVersion: v1
    kind: Service
    metadata:
      name: qa-zipkin-bridge
      namespace: qa-monitoring
      labels:
        app.kubernetes.io/name: zipkin-bridge
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: zipkin-bridge
      ports:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
        - name: otlp-http
          port: 4318
          targetPort: 4318
          protocol: TCP
