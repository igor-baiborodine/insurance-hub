groups:
  - interval: 30s
    name: insurance-hub-pricing-service
    rules:
    - alert: PricingServiceErrorRate
      annotations:
        description: More than 5% of at least 20 Pricing requests failed unexpectedly
          or exceeded their deadline in five minutes.
        runbook_action: Check database outcomes in the Pricing dashboard, correlate
          logs and traces through the tariff read, and verify PostgreSQL health before
          rollback.
        summary: Pricing service error rate exceeds the pilot threshold
      expr: sum(rate(insurance_hub_pricing_requests_total{service_name="pricing-service",insurance_hub_pricing_outcome=~"internal_error|deadline_exceeded"}[5m]))
        / sum(rate(insurance_hub_pricing_requests_total{service_name="pricing-service"}[5m]))
        > 0.05 and sum(increase(insurance_hub_pricing_requests_total{service_name="pricing-service"}[5m]))
        >= 20
      for: 2m
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingHighLatency
      annotations:
        description: Aggregate Pricing request p95 exceeded 500ms with at least 20 requests
          in five minutes.
        runbook_action: Split latency by operation and transport, then inspect database
          wait/query time and a representative slow trace.
        summary: Pricing request latency exceeds the pilot threshold
      expr: |-
        histogram_quantile(0.95,
          sum by (le) (rate(insurance_hub_pricing_request_duration_seconds_bucket{service_name="pricing-service"}[5m]))) > 0.5
        and sum(increase(insurance_hub_pricing_requests_total{service_name="pricing-service"}[5m])) >= 20
      for: 5m
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingDatabasePoolPressure
      annotations:
        description: Used Pricing database connections exceeded 80% of the configured
          maximum.
        runbook_action: Check pool wait time, timeouts, slow database operations, and
          PostgreSQL capacity; do not raise the pool limit without review.
        summary: Pricing database pool usage exceeds 80 percent
      expr: sum(db_client_connection_count{service_name="pricing-service",db_client_connection_state="used"})
        / clamp_min(sum(db_client_connection_max{service_name="pricing-service"}), 1)
        > 0.8
      for: 5m
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingDatabasePoolTimeouts
      annotations:
        description: At least one Pricing database connection timeout occurred in five
          minutes.
        runbook_action: Correlate the timeout with pool pressure and database latency,
          then verify reads and PostgreSQL availability.
        summary: Pricing database pool acquisition timed out
      expr: sum(increase(db_client_connection_timeouts_total{service_name="pricing-service"}[5m]))
        > 0
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingResourcePressure
      annotations:
        description: Pricing memory exceeded 102.4MiB or CPU exceeded 160 millicores.
        runbook_action: Inspect request load, runtime memory, throttling, pod events,
          and recent rollout changes before restarting or rolling back.
        summary: Pricing pod resource use exceeds 80 percent of its limit
      expr: sum(container_memory_working_set_bytes{namespace="qa-svc",pod=~"qa-pricing-api-.*",container="pricing-api"})
        > 107374182.4 or sum(rate(container_cpu_usage_seconds_total{namespace="qa-svc",pod=~"qa-pricing-api-.*",container="pricing-api"}[5m]))
        > 0.16
      for: 5m
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingUnavailable
      annotations:
        description: The QA Pricing Deployment has been unavailable or under-replicated
          for two minutes.
        runbook_action: Check Deployment rollout, pod readiness, events, image pull,
          configuration, and database connectivity; use the reviewed rollback owner
          if needed.
        summary: Pricing has fewer available replicas than desired
      expr: sum(kube_deployment_spec_replicas{namespace="qa-svc",deployment="qa-pricing-api"})
        > sum(kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-pricing-api"})
      for: 2m
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingTelemetryMissing
      annotations:
        description: A Pricing replica is available, but no Go runtime sample has arrived
          for two minutes.
        runbook_action: Verify Pricing telemetry configuration, Alloy receiver and remote-write
          health, then inspect the active series identity before changing the rule.
        summary: Pricing is available but runtime telemetry is missing
      expr: sum(kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-pricing-api"})
        > 0 and on() absent_over_time(go_goroutine_count{service_name="pricing-service",deployment_environment_name="qa",service_implementation="go"}[2m])
      for: 1m
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingTelemetryDeliveryFailure
      annotations:
        description: Alloy reported a Loki drop, Prometheus remote-write failure, or
          OTLP span export failure in five minutes.
        runbook_action: Identify the failing signal and backend, inspect bounded retry/drop
          counters, preserve Pricing availability, and follow the monitoring rollback
          procedure if configuration regressed.
        summary: The shared Pricing telemetry path dropped or failed data
      expr: sum(increase(loki_write_dropped_entries_total{job=~".*alloy.*"}[5m])) >
        0 or sum(increase(prometheus_remote_storage_samples_failed_total{job=~".*alloy.*"}[5m]))
        > 0 or sum(increase(prometheus_remote_storage_samples_dropped_total{job=~".*alloy.*"}[5m]))
        > 0 or sum(increase(otelcol_exporter_send_failed_spans_total{job=~".*alloy.*"}[5m]))
        > 0
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingTelemetryBacklog
      annotations:
        description: Remote-write lag exceeded 60 seconds while samples were pending,
          or an OTLP exporter queue exceeded 80%.
        runbook_action: Check backend reachability and Alloy queue/WAL metrics, keep
          the service serving reads, and verify recovery within the accepted 120-second
          budget.
        summary: The shared Pricing telemetry path has a sustained backlog
      expr: |-
        (sum(prometheus_remote_storage_samples_pending{job=~".*alloy.*"}) > 0
          and
          time() - (max(prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job=~".*alloy.*"}) or vector(0)) > 60)
        or sum(otelcol_exporter_queue_size{job=~".*alloy.*"})
          /
          clamp_min(sum(otelcol_exporter_queue_capacity{job=~".*alloy.*"}), 1) > 0.8
      for: 2m
      labels:
        service: pricing-service
        severity: warning
    - alert: PricingUnexpectedRestart
      annotations:
        description: A Pricing container restarted during the last 15 minutes.
        runbook_action: Inspect the prior container state, safe application logs, pod
          events, resource pressure, and rollout identity before deciding whether to
          roll back.
        summary: Pricing restarted unexpectedly
      expr: sum(increase(kube_pod_container_status_restarts_total{namespace="qa-svc",pod=~"qa-pricing-api-.*",container="pricing-api"}[15m]))
        > 0
      labels:
        service: pricing-service
        severity: warning
