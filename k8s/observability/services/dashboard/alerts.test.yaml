    eval_time: 30s
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardTelemetryMissing",alertstate="firing"})
      or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardTelemetryMissing",alertstate="firing"})
      or vector(0)
    eval_time: 7m
    exp_samples:
    - labels: '{}'
      value: 0
- name: genuine idle traffic and enabled idle workers are healthy
  interval: 30s
  input_series:
  - series: kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-dashboard-api"}
    values: 1x20
  - series: go_goroutine_count{service_name="dashboard-service",deployment_environment_name="qa",service_implementation="go"}
    values: 12x20
  promql_expr_test:
  - expr: count(ALERTS{alertname=~"DashboardServiceErrorRate|DashboardHighLatency|DashboardTelemetryMissing",alertstate="firing"})
      or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
- name: telemetry delivery failure fires and recovers
  interval: 30s
  input_series:
  - series: prometheus_remote_storage_samples_failed_total{job="qa-alloy"}
    values: 0+1x10 10+0x24
  - series: loki_write_dropped_entries_total{job="qa-alloy"}
    values: 0+0x34
  - series: prometheus_remote_storage_samples_dropped_total{job="qa-alloy"}
    values: 0+0x34
  - series: otelcol_exporter_send_failed_spans_total{job="qa-alloy"}
    values: 0+0x34
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardTelemetryDeliveryFailure",alertstate="firing"})
      or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardTelemetryDeliveryFailure",alertstate="firing"})
      or vector(0)
    eval_time: 10m
    exp_samples:
    - labels: '{}'
      value: 0
- name: absent exporter series do not fabricate delivery failure or backlog
  interval: 30s
  promql_expr_test:
  - expr: count(ALERTS{alertname=~"DashboardTelemetryDeliveryFailure|DashboardTelemetryBacklog",alertstate="firing"})
      or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
  input_series: []
- name: telemetry backlog fires on lag and recovers
  interval: 30s
  input_series:
  - series: prometheus_remote_storage_samples_pending{job="qa-alloy"}
    values: 1x10 0x12
  - series: prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job="qa-alloy"}
    values: '0x22'
  - series: otelcol_exporter_queue_size{job="qa-alloy"}
    values: '0x22'
  - series: otelcol_exporter_queue_capacity{job="qa-alloy"}
    values: 2048x22
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardTelemetryBacklog",alertstate="firing"})
      or vector(0)
    eval_time: 2m30s
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardTelemetryBacklog",alertstate="firing"})
      or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardTelemetryBacklog",alertstate="firing"})
      or vector(0)
    eval_time: 7m
    exp_samples:
    - labels: '{}'
      value: 0
- name: unexpected restart fires and ages out
  interval: 30s
  input_series:
  - series: kube_pod_container_status_restarts_total{namespace="qa-svc",pod="qa-dashboard-api-fixture",container="dashboard-api"}
    values: 0+1x4 4+0x42
