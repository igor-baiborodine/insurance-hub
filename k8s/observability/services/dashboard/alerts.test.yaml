      or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardUnexpectedRestart",alertstate="firing"})
      or vector(0)
    eval_time: 20m
    exp_samples:
    - labels: '{}'
      value: 0
