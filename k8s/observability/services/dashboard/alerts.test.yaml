rule_files:
- /fixture/alerts.yaml
evaluation_interval: 30s
tests:
- name: request errors respect the two minute window and recover
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_requests_total{service_name="dashboard-service",insurance_hub_dashboard_outcome="success"}
    values: 0+8x30
  - series: insurance_hub_dashboard_requests_total{service_name="dashboard-service",insurance_hub_dashboard_outcome="internal_error"}
    values: 0+2x16 32+0x14
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardServiceErrorRate",alertstate="firing"})
      or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardServiceErrorRate",alertstate="firing"})
      or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardServiceErrorRate",alertstate="firing"})
      or vector(0)
    eval_time: 14m
    exp_samples:
    - labels: '{}'
      value: 0
- name: request alerts stay inactive below twenty requests
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_requests_total{service_name="dashboard-service",insurance_hub_dashboard_outcome="success"}
    values: 0+0.4x20
  - series: insurance_hub_dashboard_requests_total{service_name="dashboard-service",insurance_hub_dashboard_outcome="internal_error"}
    values: 0+0.1x20
  - series: insurance_hub_dashboard_request_duration_seconds_bucket{service_name="dashboard-service",le="0.25"}
    values: 0+0x20
  - series: insurance_hub_dashboard_request_duration_seconds_bucket{service_name="dashboard-service",le="1"}
    values: 0+0.5x20
  - series: insurance_hub_dashboard_request_duration_seconds_bucket{service_name="dashboard-service",le="+Inf"}
    values: 0+0.5x20
  promql_expr_test:
  - expr: count(ALERTS{alertname=~"DashboardServiceErrorRate|DashboardHighLatency",alertstate="firing"})
      or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
- name: request latency respects the five minute window and recovers
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_requests_total{service_name="dashboard-service",insurance_hub_dashboard_outcome="success"}
    values: 0+10x36
  - series: insurance_hub_dashboard_request_duration_seconds_bucket{service_name="dashboard-service",le="0.25"}
    values: 0+1x18 18+10x18
  - series: insurance_hub_dashboard_request_duration_seconds_bucket{service_name="dashboard-service",le="1"}
    values: 0+10x36
  - series: insurance_hub_dashboard_request_duration_seconds_bucket{service_name="dashboard-service",le="+Inf"}
    values: 0+10x36
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardHighLatency",alertstate="firing"}) or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardHighLatency",alertstate="firing"}) or vector(0)
    eval_time: 7m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardHighLatency",alertstate="firing"}) or vector(0)
    eval_time: 17m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Elasticsearch failures fire above five percent and recover
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_dependencies_total{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",insurance_hub_dashboard_outcome="success"}
    values: 0+18x30
  - series: insurance_hub_dashboard_dependencies_total{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",insurance_hub_dashboard_outcome="error"}
    values: 0+2x16 32+0x14
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardElasticsearchFailure",alertstate="firing"})
      or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardElasticsearchFailure",alertstate="firing"})
      or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardElasticsearchFailure",alertstate="firing"})
      or vector(0)
    eval_time: 14m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Elasticsearch alerts stay inactive below twenty operations
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_dependencies_total{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",insurance_hub_dashboard_outcome="success"}
    values: 0+0.4x20
  - series: insurance_hub_dashboard_dependencies_total{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",insurance_hub_dashboard_outcome="error"}
    values: 0+0.1x20
  - series: insurance_hub_dashboard_dependency_duration_seconds_bucket{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",le="0.25"}
    values: 0+0x20
  - series: insurance_hub_dashboard_dependency_duration_seconds_bucket{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",le="1"}
    values: 0+0.5x20
  - series: insurance_hub_dashboard_dependency_duration_seconds_bucket{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",le="+Inf"}
    values: 0+0.5x20
  promql_expr_test:
  - expr: count(ALERTS{alertname=~"DashboardElasticsearchFailure|DashboardElasticsearchHighLatency",alertstate="firing"})
      or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
- name: Elasticsearch latency fires with traffic and recovers
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_dependencies_total{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",insurance_hub_dashboard_outcome="success"}
    values: 0+10x36
  - series: insurance_hub_dashboard_dependency_duration_seconds_bucket{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",le="0.25"}
    values: 0+1x18 18+10x18
  - series: insurance_hub_dashboard_dependency_duration_seconds_bucket{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",le="1"}
    values: 0+10x36
  - series: insurance_hub_dashboard_dependency_duration_seconds_bucket{service_name="dashboard-service",insurance_hub_dashboard_dependency="elasticsearch",le="+Inf"}
    values: 0+10x36
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardElasticsearchHighLatency",alertstate="firing"})
      or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardElasticsearchHighLatency",alertstate="firing"})
      or vector(0)
    eval_time: 7m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardElasticsearchHighLatency",alertstate="firing"})
      or vector(0)
    eval_time: 17m
    exp_samples:
    - labels: '{}'
      value: 0
- name: enabled registration failures fire with minimum traffic and recover
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_events_total{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered",insurance_hub_dashboard_outcome="success"}
    values: 0+8x30
  - series: insurance_hub_dashboard_events_total{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered",insurance_hub_dashboard_outcome="error"}
    values: 0+2x16 32+0x14
  - series: insurance_hub_dashboard_event_worker_enabled{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered"}
    values: 1x30
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardEventFailure",alertstate="firing"}) or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardEventFailure",alertstate="firing"}) or vector(0)
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardEventFailure",alertstate="firing"}) or vector(0)
    eval_time: 14m
    exp_samples:
    - labels: '{}'
      value: 0
- name: event alerts stay inactive below traffic or while disabled
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_events_total{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered",insurance_hub_dashboard_outcome="success"}
    values: 0+0.15x20
  - series: insurance_hub_dashboard_events_total{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered",insurance_hub_dashboard_outcome="error"}
    values: 0+0.1x20
  - series: insurance_hub_dashboard_event_worker_enabled{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered"}
    values: 0x20
  - series: insurance_hub_dashboard_event_worker_in_flight_age_seconds{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered"}
    values: 60x20
  promql_expr_test:
  - expr: count(ALERTS{alertname=~"DashboardEventFailure|DashboardEventStalled",alertstate="firing"}) or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
- name: event failures stay inactive with sufficient traffic while disabled
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_events_total{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered",insurance_hub_dashboard_outcome="success"}
    values: 0+8x20
  - series: insurance_hub_dashboard_events_total{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered",insurance_hub_dashboard_outcome="error"}
    values: 0+2x20
  - series: insurance_hub_dashboard_event_worker_enabled{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered"}
    values: 0x20
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardEventFailure",alertstate="firing"}) or vector(0)
    eval_time: 9m
    exp_samples:
    - labels: '{}'
      value: 0
- name: enabled registration stall fires after two minutes and recovers
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_event_worker_enabled{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered"}
    values: 1x20
  - series: insurance_hub_dashboard_event_worker_in_flight_age_seconds{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered"}
    values: 0 31x9 0x10
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardEventStalled",alertstate="firing"}) or vector(0)
    eval_time: 2m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardEventStalled",alertstate="firing"}) or vector(0)
    eval_time: 2m30s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardEventStalled",alertstate="firing"}) or vector(0)
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 0
- name: registration commit failure fires immediately and recovers
  interval: 30s
  input_series:
  - series: insurance_hub_dashboard_event_commit_failures_total{service_name="dashboard-service",insurance_hub_dashboard_event_type="registered"}
    values: 0+1x2 2+0x20
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardEventCommitFailure",alertstate="firing"}) or vector(0)
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardEventCommitFailure",alertstate="firing"}) or vector(0)
    eval_time: 8m
    exp_samples:
    - labels: '{}'
      value: 0
- name: resource pressure fires and recovers
  interval: 30s
  input_series:
  - series: container_memory_working_set_bytes{namespace="qa-svc",pod="qa-dashboard-api-fixture",container="dashboard-api"}
    values: 220000000x14 100000000x10
  - series: container_cpu_usage_seconds_total{namespace="qa-svc",pod="qa-dashboard-api-fixture",container="dashboard-api"}
    values: 0+0.01x24
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardResourcePressure",alertstate="firing"})
      or vector(0)
    eval_time: 4m30s
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardResourcePressure",alertstate="firing"})
      or vector(0)
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardResourcePressure",alertstate="firing"})
      or vector(0)
    eval_time: 8m
    exp_samples:
    - labels: '{}'
      value: 0
- name: unavailable deployment fires independently of telemetry absence and recovers
  interval: 30s
  input_series:
  - series: kube_deployment_spec_replicas{namespace="qa-svc",deployment="qa-dashboard-api"}
    values: 1x24
  - series: kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-dashboard-api"}
    values: 0x14 1x10
  promql_expr_test:
  - expr: count(ALERTS{alertname="DashboardUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 1m30s
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: count(ALERTS{alertname="DashboardTelemetryMissing",alertstate="firing"})
      or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 0
  - expr: count(ALERTS{alertname="DashboardUnavailable",alertstate="firing"}) or vector(0)
    eval_time: 8m
    exp_samples:
    - labels: '{}'
      value: 0
- name: available deployment with missing runtime data fires and recovers
  interval: 30s
  input_series:
  - series: kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-dashboard-api"}
    values: 1x20
  - series: go_goroutine_count{service_name="dashboard-service",deployment_environment_name="qa",service_implementation="go"}
