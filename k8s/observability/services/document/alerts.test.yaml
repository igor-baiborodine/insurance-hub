rule_files:
  - "/fixture/alerts.yaml"
evaluation_interval: "30s"
tests:
  - name: "request errors respect the two minute window and recover"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_requests_total{service_name=\"document-service\",insurance_hub_document_outcome=\"success\"}"
        values: "0+8x30"
      - series: "insurance_hub_document_requests_total{service_name=\"document-service\",insurance_hub_document_outcome=\"internal_error\"}"
        values: "0+2x16 32+0x14"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentServiceErrorRate\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentServiceErrorRate\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "4m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentServiceErrorRate\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "14m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "request alerts stay inactive below twenty requests"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_requests_total{service_name=\"document-service\",insurance_hub_document_outcome=\"success\"}"
        values: "0+0.4x20"
      - series: "insurance_hub_document_requests_total{service_name=\"document-service\",insurance_hub_document_outcome=\"internal_error\"}"
        values: "0+0.1x20"
      - series: "insurance_hub_document_request_duration_seconds_bucket{service_name=\"document-service\",le=\"0.25\"}"
        values: "0+0x20"
      - series: "insurance_hub_document_request_duration_seconds_bucket{service_name=\"document-service\",le=\"1\"}"
        values: "0+0.5x20"
      - series: "insurance_hub_document_request_duration_seconds_bucket{service_name=\"document-service\",le=\"+Inf\"}"
        values: "0+0.5x20"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=~\"DocumentServiceErrorRate|DocumentHighLatency\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "9m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "request latency respects the five minute window and recovers"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_requests_total{service_name=\"document-service\",insurance_hub_document_outcome=\"success\"}"
        values: "0+10x36"
      - series: "insurance_hub_document_request_duration_seconds_bucket{service_name=\"document-service\",le=\"0.25\"}"
        values: "0+1x18 18+10x18"
      - series: "insurance_hub_document_request_duration_seconds_bucket{service_name=\"document-service\",le=\"1\"}"
        values: "0+10x36"
      - series: "insurance_hub_document_request_duration_seconds_bucket{service_name=\"document-service\",le=\"+Inf\"}"
        values: "0+10x36"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentHighLatency\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "4m"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentHighLatency\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "7m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentHighLatency\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "17m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "generation stage failure fires on the first bounded failure and recovers"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_dependencies_total{service_name=\"document-service\",insurance_hub_document_operation=\"generate_document\",insurance_hub_document_dependency=\"postgresql\",insurance_hub_document_stage=\"metadata\",insurance_hub_document_outcome=\"success\"}"
        values: "0+1x18"
      - series: "insurance_hub_document_dependencies_total{service_name=\"document-service\",insurance_hub_document_operation=\"generate_document\",insurance_hub_document_dependency=\"postgresql\",insurance_hub_document_stage=\"metadata\",insurance_hub_document_outcome=\"error\"}"
        values: "0+0x2 0+1x2 2+0x14"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentGenerationStageFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentGenerationStageFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentGenerationStageFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "9m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "complete lookups stay healthy while the first partial lookup fires and recovers"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_lookup_results_total{service_name=\"document-service\",insurance_hub_document_lookup_outcome=\"complete\"}"
        values: "0+1x18"
      - series: "insurance_hub_document_lookup_results_total{service_name=\"document-service\",insurance_hub_document_lookup_outcome=\"partial\"}"
        values: "0+0x2 0+1x2 2+0x14"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentLookupFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentLookupFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentLookupFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "9m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "enabled registration failure fires on the first event and recovers"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_events_total{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\",insurance_hub_document_outcome=\"error\"}"
        values: "0+0x2 0+1x2 2+0x14"
      - series: "insurance_hub_document_event_worker_enabled{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "1x18"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentEventFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentEventFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentEventFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "9m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "enabled registration stall fires after two minutes and recovers"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_event_worker_enabled{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "1x20"
      - series: "insurance_hub_document_event_worker_in_flight_age_seconds{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "0 31x9 0x10"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentEventStalled\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentEventStalled\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m30s"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentEventStalled\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "6m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "enabled failed worker fires after one minute and clears"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_event_worker_enabled{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "1x18"
      - series: "insurance_hub_document_event_worker_failed{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "0x2 1x6 0x10"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentEventWorkerFailed\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentEventWorkerFailed\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m30s"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentEventWorkerFailed\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "5m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "disabled worker suppresses failure stall and failed-state alerts"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_events_total{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\",insurance_hub_document_outcome=\"error\"}"
        values: "0+1x14"
      - series: "insurance_hub_document_event_worker_enabled{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "0x14"
      - series: "insurance_hub_document_event_worker_in_flight_age_seconds{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "60x14"
      - series: "insurance_hub_document_event_worker_failed{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "1x14"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=~\"DocumentEventFailure|DocumentEventStalled|DocumentEventWorkerFailed\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "6m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "registration commit failure fires immediately and recovers"
    interval: "30s"
    input_series:
      - series: "insurance_hub_document_event_commit_failures_total{service_name=\"document-service\",insurance_hub_document_event_type=\"registered\"}"
        values: "0+1x2 2+0x20"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentEventCommitFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "1m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentEventCommitFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "8m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "resource pressure fires and recovers"
    interval: "30s"
    input_series:
      - series: "container_memory_working_set_bytes{namespace=\"qa-svc\",pod=\"qa-document-api-fixture\",container=\"document-api\"}"
        values: "220000000x14 100000000x10"
      - series: "container_cpu_usage_seconds_total{namespace=\"qa-svc\",pod=\"qa-document-api-fixture\",container=\"document-api\"}"
        values: "0+0.01x24"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentResourcePressure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "4m30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentResourcePressure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "6m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentResourcePressure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "8m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "unavailable deployment fires independently of telemetry absence and recovers"
    interval: "30s"
    input_series:
      - series: "kube_deployment_spec_replicas{namespace=\"qa-svc\",deployment=\"qa-document-api\"}"
        values: "1x24"
      - series: "kube_deployment_status_replicas_available{namespace=\"qa-svc\",deployment=\"qa-document-api\"}"
        values: "0x14 1x10"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentUnavailable\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "1m30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentUnavailable\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "3m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryMissing\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "3m"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentUnavailable\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "8m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "available deployment with missing runtime data fires and recovers"
    interval: "30s"
    input_series:
      - series: "kube_deployment_status_replicas_available{namespace=\"qa-svc\",deployment=\"qa-document-api\"}"
        values: "1x20"
      - series: "go_goroutine_count{service_name=\"document-service\",deployment_environment_name=\"qa\",service_implementation=\"go\"}"
        values: "_x10 12x10"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryMissing\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryMissing\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "4m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryMissing\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "7m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "genuine idle traffic and enabled idle workers are healthy"
    interval: "30s"
    input_series:
      - series: "kube_deployment_status_replicas_available{namespace=\"qa-svc\",deployment=\"qa-document-api\"}"
        values: "1x20"
      - series: "go_goroutine_count{service_name=\"document-service\",deployment_environment_name=\"qa\",service_implementation=\"go\"}"
        values: "12x20"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=~\"DocumentServiceErrorRate|DocumentHighLatency|DocumentTelemetryMissing\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "9m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "telemetry delivery failure fires and recovers"
    interval: "30s"
    input_series:
      - series: "prometheus_remote_storage_samples_failed_total{job=\"qa-alloy\"}"
        values: "0+1x10 10+0x24"
      - series: "loki_write_dropped_entries_total{job=\"qa-alloy\"}"
        values: "0+0x34"
      - series: "prometheus_remote_storage_samples_dropped_total{job=\"qa-alloy\"}"
        values: "0+0x34"
      - series: "otelcol_exporter_send_failed_spans_total{job=\"qa-alloy\"}"
        values: "0+0x34"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryDeliveryFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "4m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryDeliveryFailure\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "10m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "absent exporter series do not fabricate delivery failure or backlog"
    interval: "30s"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=~\"DocumentTelemetryDeliveryFailure|DocumentTelemetryBacklog\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "9m"
        exp_samples:
          - labels: "{}"
            value: 0
    input_series:

  - name: "telemetry backlog fires on lag and recovers"
    interval: "30s"
    input_series:
      - series: "prometheus_remote_storage_samples_pending{job=\"qa-alloy\"}"
        values: "1x10 0x12"
      - series: "prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job=\"qa-alloy\"}"
        values: "0x22"
      - series: "otelcol_exporter_queue_size{job=\"qa-alloy\"}"
        values: "0x22"
      - series: "otelcol_exporter_queue_capacity{job=\"qa-alloy\"}"
        values: "2048x22"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryBacklog\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m30s"
        exp_samples:
          - labels: "{}"
            value: 0
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryBacklog\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "3m30s"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentTelemetryBacklog\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "7m"
        exp_samples:
          - labels: "{}"
            value: 0
  - name: "unexpected restart fires and ages out"
    interval: "30s"
    input_series:
      - series: "kube_pod_container_status_restarts_total{namespace=\"qa-svc\",pod=\"qa-document-api-fixture\",container=\"document-api\"}"
        values: "0+1x4 4+0x42"
    promql_expr_test:
      - expr: "count(ALERTS{alertname=\"DocumentUnexpectedRestart\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "2m"
        exp_samples:
          - labels: "{}"
            value: 1
      - expr: "count(ALERTS{alertname=\"DocumentUnexpectedRestart\",alertstate=\"firing\"}) or vector(0)"
        eval_time: "20m"
        exp_samples:
          - labels: "{}"
            value: 0
