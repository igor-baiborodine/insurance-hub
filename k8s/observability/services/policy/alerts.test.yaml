rule_files:
  - /fixture/alerts.yaml

evaluation_interval: 30s

tests:
  - name: service errors fire above five percent with minimum HTTP traffic and recover
    interval: 30s
    input_series:
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="success"}'
        values: '0+9x30'
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="internal_error"}'
        values: '0+1x16 16+0x14'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyServiceErrorRate",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyServiceErrorRate",alertstate="firing"}) or vector(0)'
        eval_time: 14m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: wrong outcome, internal gRPC hop and another service do not fire Policy errors
    interval: 30s
    input_series:
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="success"}'
        values: '0+9x30'
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="invalid_request"}'
        values: '0+5x30'
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="grpc",insurance_hub_service_outcome="internal_error"}'
        values: '0+5x30'
      - series: 'insurance_hub_service_requests_total{service_name="policy-search-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="internal_error"}'
        values: '0+5x30'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyServiceErrorRate",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: error and latency alerts stay inactive below twenty requests
    interval: 30s
    input_series:
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="success"}'
        values: '0+0.4x20'
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="internal_error"}'
        values: '0+0.1x20'
      - series: 'insurance_hub_service_request_duration_seconds_bucket{service_name="policy-service",insurance_hub_service_transport="http",le="0.5"}'
        values: '0+0x20'
      - series: 'insurance_hub_service_request_duration_seconds_bucket{service_name="policy-service",insurance_hub_service_transport="http",le="+Inf"}'
        values: '0+0.5x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"PolicyServiceErrorRate|PolicyHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: high request latency fires with traffic and recovers
    interval: 30s
    input_series:
      - series: 'insurance_hub_service_requests_total{service_name="policy-service",insurance_hub_service_transport="http",insurance_hub_service_outcome="success"}'
        values: '0+10x34'
      - series: 'insurance_hub_service_request_duration_seconds_bucket{service_name="policy-service",insurance_hub_service_transport="http",le="0.5"}'
        values: '0+1x16 16+10x18'
      - series: 'insurance_hub_service_request_duration_seconds_bucket{service_name="policy-service",insurance_hub_service_transport="http",le="1"}'
        values: '0+10x34'
      - series: 'insurance_hub_service_request_duration_seconds_bucket{service_name="policy-service",insurance_hub_service_transport="http",le="+Inf"}'
        values: '0+10x34'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 16m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: provider RPC failure fires for the failing method only and recovers
    interval: 30s
    input_series:
      - series: 'rpc_client_call_duration_seconds_count{service_name="policy-service",rpc_method="product.v1.ProductService/GetProduct",rpc_response_status_code="OK"}'
        values: '0+9x30'
      - series: 'rpc_client_call_duration_seconds_count{service_name="policy-service",rpc_method="product.v1.ProductService/GetProduct",rpc_response_status_code="UNAVAILABLE"}'
        values: '0+1x16 16+0x14'
      - series: 'rpc_client_call_duration_seconds_count{service_name="policy-service",rpc_method="pricing.v1.PricingService/CalculatePrice",rpc_response_status_code="OK"}'
        values: '0+9x30'
      - series: 'rpc_client_call_duration_seconds_count{service_name="policy-service",rpc_method="pricing.v1.PricingService/CalculatePrice",rpc_response_status_code="NOT_FOUND"}'
        values: '0+5x30'
      - series: 'rpc_client_call_duration_seconds_count{service_name="policy-service",rpc_method="policy.v1.PolicyService/CreateOffer",rpc_response_status_code="UNAVAILABLE"}'
        values: '0+5x30'
    promql_expr_test:
      - expr: 'count by (rpc_method) (ALERTS{alertname="PolicyUpstreamRPCFailure",alertstate="firing"})'
        eval_time: 7m
        exp_samples:
          - labels: '{rpc_method="product.v1.ProductService/GetProduct"}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyUpstreamRPCFailure",alertstate="firing"}) or vector(0)'
        eval_time: 14m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: provider RPC failure stays inactive below ten calls
    interval: 30s
    input_series:
      - series: 'rpc_client_call_duration_seconds_count{service_name="policy-service",rpc_method="pricing.v1.PricingService/CalculatePrice",rpc_response_status_code="UNAVAILABLE"}'
        values: '0+0.1x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyUpstreamRPCFailure",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: database readiness loss fires the database alert only and recovers
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_dependency_ready{service_name="policy-service",insurance_hub_policy_dependency="database"}'
        values: '1x4 0x10 1x10'
      - series: 'insurance_hub_policy_dependency_ready{service_name="policy-service",insurance_hub_policy_dependency="kafka"}'
        values: '1x24'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyDatabaseNotReady",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname=~"PolicyKafkaNotReady|PolicyEventPublicationFailure",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicyDatabaseNotReady",alertstate="firing"}) or vector(0)'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: kafka readiness loss fires the kafka alert only and recovers
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_dependency_ready{service_name="policy-service",insurance_hub_policy_dependency="kafka"}'
        values: '1x4 0x10 1x10'
      - series: 'insurance_hub_policy_dependency_ready{service_name="policy-service",insurance_hub_policy_dependency="database"}'
        values: '1x24'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyKafkaNotReady",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyDatabaseNotReady",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicyKafkaNotReady",alertstate="firing"}) or vector(0)'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: event publication error fires and ages out
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_event_publications_total{service_name="policy-service",insurance_hub_policy_event_type="registered",insurance_hub_policy_event_outcome="success"}'
        values: '0+5x34'
      - series: 'insurance_hub_policy_event_publications_total{service_name="policy-service",insurance_hub_policy_event_type="registered",insurance_hub_policy_event_outcome="error"}'
        values: '0+1x4 4+0x30'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyEventPublicationFailure",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyEventPublicationFailure",alertstate="firing"}) or vector(0)'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: first publication error on a healthy producer fires and clears
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_event_publications_total{service_name="policy-service",insurance_hub_policy_event_type="registered",insurance_hub_policy_event_outcome="success"}'
        values: '0+5x40'
      - series: 'insurance_hub_policy_event_publications_total{service_name="policy-service",insurance_hub_policy_event_type="registered",insurance_hub_policy_event_outcome="error"}'
        values: '0x10 1x30'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyEventPublicationFailure",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicyEventPublicationFailure",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyEventPublicationFailure",alertstate="firing"}) or vector(0)'
        eval_time: 12m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: cancelled publication or another service does not fire publication failure
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_event_publications_total{service_name="policy-service",insurance_hub_policy_event_type="terminated",insurance_hub_policy_event_outcome="cancelled"}'
        values: '0+1x20'
      - series: 'insurance_hub_policy_event_publications_total{service_name="policy-search-service",insurance_hub_policy_event_type="registered",insurance_hub_policy_event_outcome="error"}'
        values: '0+1x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyEventPublicationFailure",alertstate="firing"}) or vector(0)'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: memory pressure fires and recovers
    interval: 30s
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="qa-svc",pod="qa-policy-api-fixture",container="policy-api"}'
        values: '110000000x14 50000000x10'
      - series: 'container_cpu_usage_seconds_total{namespace="qa-svc",pod="qa-policy-api-fixture",container="policy-api"}'
        values: '0+0.01x24'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyResourcePressure",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyResourcePressure",alertstate="firing"}) or vector(0)'
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: legacy pod resource use does not fire Policy pressure
    interval: 30s
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="qa-svc",pod="qa-policy-api-legacy-fixture",container="policy-api"}'
        values: '220000000x24'
      - series: 'container_memory_working_set_bytes{namespace="qa-svc",pod="qa-policy-api-fixture",container="policy-api"}'
        values: '50000000x24'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyResourcePressure",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: unavailable deployment fires independently of telemetry absence and recovers
    interval: 30s
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="qa-svc",deployment="qa-policy-api"}'
        values: '1x14 1x10'
      - series: 'kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-policy-api"}'
        values: '0x14 1x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyUnavailable",alertstate="firing"}) or vector(0)'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyTelemetryMissing",alertstate="firing"}) or vector(0)'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicyUnavailable",alertstate="firing"}) or vector(0)'
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: available deployment with missing runtime data fires and recovers
    interval: 30s
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-policy-api"}'
        values: '1x20'
      - series: 'go_goroutine_count{service_name="policy-service",deployment_environment_name="qa",service_implementation="go"}'
        values: '_x10 12x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyTelemetryMissing",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyTelemetryMissing",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: genuine idle traffic with runtime data and ready dependencies is healthy
    interval: 30s
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-policy-api"}'
        values: '1x20'
      - series: 'go_goroutine_count{service_name="policy-service",deployment_environment_name="qa",service_implementation="go"}'
        values: '12x20'
      - series: 'insurance_hub_policy_dependency_ready{service_name="policy-service",insurance_hub_policy_dependency="database"}'
        values: '1x20'
      - series: 'insurance_hub_policy_dependency_ready{service_name="policy-service",insurance_hub_policy_dependency="kafka"}'
        values: '1x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: telemetry delivery failure fires and recovers
    interval: 30s
    input_series:
      - series: 'prometheus_remote_storage_samples_failed_total{job="qa-alloy"}'
        values: '0+1x10 10+0x24'
      - series: 'loki_write_dropped_entries_total{job="qa-alloy"}'
        values: '0+0x34'
      - series: 'prometheus_remote_storage_samples_dropped_total{job="qa-alloy"}'
        values: '0+0x34'
      - series: 'otelcol_exporter_send_failed_spans_total{job="qa-alloy"}'
        values: '0+0x34'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyTelemetryDeliveryFailure",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyTelemetryDeliveryFailure",alertstate="firing"}) or vector(0)'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: absent exporter series do not fabricate delivery failure or backlog
    interval: 30s
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"PolicyTelemetryDeliveryFailure|PolicyTelemetryBacklog",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: telemetry backlog fires on lag and recovers
    interval: 30s
    input_series:
      - series: 'prometheus_remote_storage_samples_pending{job="qa-alloy"}'
        values: '1x10 0x12'
      - series: 'prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job="qa-alloy"}'
        values: '0x22'
      - series: 'otelcol_exporter_queue_size{job="qa-alloy"}'
        values: '0x22'
      - series: 'otelcol_exporter_queue_capacity{job="qa-alloy"}'
        values: '2048x22'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyTelemetryBacklog",alertstate="firing"}) or vector(0)'
        eval_time: 3m30s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyTelemetryBacklog",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: unexpected restart fires and ages out
    interval: 30s
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="qa-svc",pod="qa-policy-api-fixture",container="policy-api"}'
        values: '0+1x4 4+0x42'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicyUnexpectedRestart",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicyUnexpectedRestart",alertstate="firing"}) or vector(0)'
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 0
