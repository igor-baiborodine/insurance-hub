rule_files:
  - /fixture/alerts.yaml

evaluation_interval: 30s

tests:
  - name: request errors respect the two minute window and recover
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_requests_total{service_name="policy-search-service",insurance_hub_policy_search_outcome="success"}'
        values: '0+8x30'
      - series: 'insurance_hub_policy_search_requests_total{service_name="policy-search-service",insurance_hub_policy_search_outcome="internal_error"}'
        values: '0+2x16 32+0x14'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchServiceErrorRate",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicySearchServiceErrorRate",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchServiceErrorRate",alertstate="firing"}) or vector(0)'
        eval_time: 14m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: request alerts stay inactive below twenty requests
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_requests_total{service_name="policy-search-service",insurance_hub_policy_search_outcome="success"}'
        values: '0+0.4x20'
      - series: 'insurance_hub_policy_search_requests_total{service_name="policy-search-service",insurance_hub_policy_search_outcome="internal_error"}'
        values: '0+0.1x20'
      - series: 'insurance_hub_policy_search_request_duration_seconds_bucket{service_name="policy-search-service",le="0.25"}'
        values: '0+0x20'
      - series: 'insurance_hub_policy_search_request_duration_seconds_bucket{service_name="policy-search-service",le="1"}'
        values: '0+0.5x20'
      - series: 'insurance_hub_policy_search_request_duration_seconds_bucket{service_name="policy-search-service",le="+Inf"}'
        values: '0+0.5x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"PolicySearchServiceErrorRate|PolicySearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: request latency respects the five minute window and recovers
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_requests_total{service_name="policy-search-service",insurance_hub_policy_search_outcome="success"}'
        values: '0+10x36'
      - series: 'insurance_hub_policy_search_request_duration_seconds_bucket{service_name="policy-search-service",le="0.25"}'
        values: '0+1x18 18+10x18'
      - series: 'insurance_hub_policy_search_request_duration_seconds_bucket{service_name="policy-search-service",le="1"}'
        values: '0+10x36'
      - series: 'insurance_hub_policy_search_request_duration_seconds_bucket{service_name="policy-search-service",le="+Inf"}'
        values: '0+10x36'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicySearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 17m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: Elasticsearch failures fire above five percent and recover
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_dependencies_total{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",insurance_hub_policy_search_outcome="success"}'
        values: '0+18x30'
      - series: 'insurance_hub_policy_search_dependencies_total{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",insurance_hub_policy_search_outcome="error"}'
        values: '0+2x16 32+0x14'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchElasticsearchFailure",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicySearchElasticsearchFailure",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchElasticsearchFailure",alertstate="firing"}) or vector(0)'
        eval_time: 14m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: Elasticsearch alerts stay inactive below twenty operations
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_dependencies_total{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",insurance_hub_policy_search_outcome="success"}'
        values: '0+0.4x20'
      - series: 'insurance_hub_policy_search_dependencies_total{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",insurance_hub_policy_search_outcome="error"}'
        values: '0+0.1x20'
      - series: 'insurance_hub_policy_search_dependency_duration_seconds_bucket{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",le="0.25"}'
        values: '0+0x20'
      - series: 'insurance_hub_policy_search_dependency_duration_seconds_bucket{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",le="1"}'
        values: '0+0.5x20'
      - series: 'insurance_hub_policy_search_dependency_duration_seconds_bucket{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",le="+Inf"}'
        values: '0+0.5x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"PolicySearchElasticsearchFailure|PolicySearchElasticsearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: Elasticsearch latency fires with traffic and recovers
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_dependencies_total{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",insurance_hub_policy_search_outcome="success"}'
        values: '0+10x36'
      - series: 'insurance_hub_policy_search_dependency_duration_seconds_bucket{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",le="0.25"}'
        values: '0+1x18 18+10x18'
      - series: 'insurance_hub_policy_search_dependency_duration_seconds_bucket{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",le="1"}'
        values: '0+10x36'
      - series: 'insurance_hub_policy_search_dependency_duration_seconds_bucket{service_name="policy-search-service",insurance_hub_policy_search_dependency="elasticsearch",le="+Inf"}'
        values: '0+10x36'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchElasticsearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicySearchElasticsearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchElasticsearchHighLatency",alertstate="firing"}) or vector(0)'
        eval_time: 17m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: enabled event failures fire with minimum traffic and recover
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_events_total{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered",insurance_hub_policy_search_outcome="success"}'
        values: '0+8x30'
      - series: 'insurance_hub_policy_search_events_total{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered",insurance_hub_policy_search_outcome="error"}'
        values: '0+2x16 32+0x14'
      - series: 'insurance_hub_policy_search_event_worker_enabled{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered"}'
        values: '1x30'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchEventFailure",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicySearchEventFailure",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchEventFailure",alertstate="firing"}) or vector(0)'
        eval_time: 14m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: enabled event failure stays inactive below ten completed events
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_events_total{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered",insurance_hub_policy_search_outcome="success"}'
        values: '0+0.15x20'
      - series: 'insurance_hub_policy_search_events_total{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered",insurance_hub_policy_search_outcome="error"}'
        values: '0+0.1x20'
      - series: 'insurance_hub_policy_search_event_worker_enabled{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered"}'
        values: '1x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchEventFailure",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: event alerts stay inactive when workers are disabled
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_events_total{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered",insurance_hub_policy_search_outcome="success"}'
        values: '0+8x20'
      - series: 'insurance_hub_policy_search_events_total{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered",insurance_hub_policy_search_outcome="error"}'
        values: '0+2x20'
      - series: 'insurance_hub_policy_search_event_worker_enabled{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered"}'
        values: '0x20'
      - series: 'insurance_hub_policy_search_event_worker_in_flight_age_seconds{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered"}'
        values: '60x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"PolicySearchEventFailure|PolicySearchEventStalled",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: enabled event stall fires after two minutes and completion recovers
    interval: 30s
    input_series:
      - series: 'insurance_hub_policy_search_event_worker_enabled{service_name="policy-search-service",insurance_hub_policy_search_event_type="terminated"}'
        values: '1x20'
      - series: 'insurance_hub_policy_search_event_worker_in_flight_age_seconds{service_name="policy-search-service",insurance_hub_policy_search_event_type="terminated"}'
        values: '31x10 0x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchEventStalled",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchEventStalled",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: resource pressure fires and recovers
    interval: 30s
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="qa-svc",pod="qa-policy-search-api-fixture",container="policy-search-api"}'
        values: '220000000x14 100000000x10'
      - series: 'container_cpu_usage_seconds_total{namespace="qa-svc",pod="qa-policy-search-api-fixture",container="policy-search-api"}'
        values: '0+0.01x24'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchResourcePressure",alertstate="firing"}) or vector(0)'
        eval_time: 6m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchResourcePressure",alertstate="firing"}) or vector(0)'
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: unavailable deployment fires independently of telemetry absence and recovers
    interval: 30s
    input_series:
      - series: 'kube_deployment_spec_replicas{namespace="qa-svc",deployment="qa-policy-search-api"}'
        values: '1x24'
      - series: 'kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-policy-search-api"}'
        values: '0x14 1x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchUnavailable",alertstate="firing"}) or vector(0)'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchTelemetryMissing",alertstate="firing"}) or vector(0)'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: 'count(ALERTS{alertname="PolicySearchUnavailable",alertstate="firing"}) or vector(0)'
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: available deployment with missing runtime data fires and recovers
    interval: 30s
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-policy-search-api"}'
        values: '1x20'
      - series: 'go_goroutine_count{service_name="policy-search-service",deployment_environment_name="qa",service_implementation="go"}'
        values: '_x10 12x10'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchTelemetryMissing",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchTelemetryMissing",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: genuine idle traffic and enabled idle workers are healthy
    interval: 30s
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="qa-svc",deployment="qa-policy-search-api"}'
        values: '1x20'
      - series: 'go_goroutine_count{service_name="policy-search-service",deployment_environment_name="qa",service_implementation="go"}'
        values: '12x20'
      - series: 'insurance_hub_policy_search_event_worker_enabled{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered"}'
        values: '1x20'
      - series: 'insurance_hub_policy_search_event_worker_in_flight_age_seconds{service_name="policy-search-service",insurance_hub_policy_search_event_type="registered"}'
        values: '0x20'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"PolicySearchServiceErrorRate|PolicySearchHighLatency|PolicySearchEventFailure|PolicySearchEventStalled|PolicySearchTelemetryMissing",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: telemetry delivery failure fires and recovers
    interval: 30s
    input_series:
      - series: 'prometheus_remote_storage_samples_failed_total{job="qa-alloy"}'
        values: '0+1x10 10+0x24'
      - series: 'loki_write_dropped_entries_total{job="qa-alloy"}'
        values: '0+0x34'
      - series: 'prometheus_remote_storage_samples_dropped_total{job="qa-alloy"}'
        values: '0+0x34'
      - series: 'otelcol_exporter_send_failed_spans_total{job="qa-alloy"}'
        values: '0+0x34'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchTelemetryDeliveryFailure",alertstate="firing"}) or vector(0)'
        eval_time: 4m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchTelemetryDeliveryFailure",alertstate="firing"}) or vector(0)'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: absent exporter series do not fabricate delivery failure or backlog
    interval: 30s
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"PolicySearchTelemetryDeliveryFailure|PolicySearchTelemetryBacklog",alertstate="firing"}) or vector(0)'
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: telemetry backlog fires on lag and recovers
    interval: 30s
    input_series:
      - series: 'prometheus_remote_storage_samples_pending{job="qa-alloy"}'
        values: '1x10 0x12'
      - series: 'prometheus_remote_storage_queue_highest_sent_timestamp_seconds{job="qa-alloy"}'
        values: '0x22'
      - series: 'otelcol_exporter_queue_size{job="qa-alloy"}'
        values: '0x22'
      - series: 'otelcol_exporter_queue_capacity{job="qa-alloy"}'
        values: '2048x22'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchTelemetryBacklog",alertstate="firing"}) or vector(0)'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchTelemetryBacklog",alertstate="firing"}) or vector(0)'
        eval_time: 7m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: unexpected restart fires and ages out
    interval: 30s
    input_series:
      - series: 'kube_pod_container_status_restarts_total{namespace="qa-svc",pod="qa-policy-search-api-fixture",container="policy-search-api"}'
        values: '0+1x4 4+0x42'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="PolicySearchUnexpectedRestart",alertstate="firing"}) or vector(0)'
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: 'count(ALERTS{alertname="PolicySearchUnexpectedRestart",alertstate="firing"}) or vector(0)'
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 0
