apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-api
  labels:
    app.kubernetes.io/name: document-api
    app.kubernetes.io/instance: insurance-hub-document-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: document-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-api
        app.kubernetes.io/instance: insurance-hub-document-api
        app.kubernetes.io/component: api
      annotations:
        insurance-hub.io/document-reader-credential-revision: "1"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: document-api
          image: insurance-hub-document-api:unconfigured
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          env:
            - name: DOCUMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-document-reader-creds
                  key: database-url
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: minio-document-reader-creds
                  key: endpoint
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-document-reader-creds
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-document-reader-creds
                  key: secret-key
            - name: SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.uid
          envFrom:
            - configMapRef:
                name: document-config
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/document-service/postgres
              readOnly: true
            - name: minio-ca
              mountPath: /etc/document-service/minio
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /livez
              port: management
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: management
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
      volumes:
        - name: postgres-ca
          secret:
            secretName: postgres-document-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
        - name: minio-ca
          secret:
            secretName: minio-document-reader-creds
            items:
              - key: ca.crt
                path: ca.crt
            defaultMode: 420
