apiVersion: v1
kind: Service
metadata:
  name: product-api
  labels:
    app.kubernetes.io/name: product-api
    app.kubernetes.io/instance: insurance-hub-product-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
