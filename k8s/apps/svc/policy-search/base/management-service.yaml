  name: policy-search-api-management
  labels:
    app.kubernetes.io/name: policy-search-api
    app.kubernetes.io/component: management
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: policy-search-api
    app.kubernetes.io/component: api
  ports:
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
