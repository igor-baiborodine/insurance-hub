apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: dashboard-api
      app.kubernetes.io/part-of: insurance-hub
      app.kubernetes.io/managed-by: kustomize
resources:
  - deployment.yaml
  - service.yaml
  - management-service.yaml
  - network-policy.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: dashboard-config
    literals:
      - SERVICE_NAME=dashboard-service
      - HTTP_ADDR=0.0.0.0:8080
      - GRPC_ADDR=0.0.0.0:9090
      - HEALTH_ADDR=0.0.0.0:8081
      - REQUEST_TIMEOUT=8s
      - PROBE_TIMEOUT=2s
      - SHUTDOWN_TIMEOUT=10s
      - HTTP_READ_HEADER_TIMEOUT=5s
      - HTTP_READ_TIMEOUT=10s
      - HTTP_WRITE_TIMEOUT=10s
      - HTTP_IDLE_TIMEOUT=30s
      - HTTP_MAX_HEADER_BYTES=16384
      - HTTP_MAX_BODY_BYTES=4096
      - GRPC_MAX_RECV_BYTES=1048576
      - GRPC_MAX_SEND_BYTES=8388608
      - LOG_LEVEL=info
      - OTEL_ENABLED=false
      - OTEL_EXPORTER_OTLP_TIMEOUT=2s
      - DEPLOYMENT_ENVIRONMENT=unconfigured
      - SERVICE_VERSION=git-000000000000
