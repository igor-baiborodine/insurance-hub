apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  labels:
    app.kubernetes.io/name: dashboard-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashboard-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - name: grpc
      port: 9090
      protocol: TCP
      targetPort: grpc
