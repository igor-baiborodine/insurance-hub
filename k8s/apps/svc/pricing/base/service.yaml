apiVersion: v1
kind: Service
metadata:
  name: pricing-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pricing-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: grpc
      protocol: TCP
