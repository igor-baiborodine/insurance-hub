apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: pricing-api
      app.kubernetes.io/part-of: insurance-hub
      app.kubernetes.io/managed-by: kustomize
resources:
  - deployment.yaml
  - network-policy.yaml
  - service.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: pricing-config
    literals:
      - SERVICE_NAME=pricing-service
      - HTTP_ADDR=0.0.0.0:8080
      - GRPC_ADDR=0.0.0.0:9090
      - HEALTH_ADDR=0.0.0.0:8081
      - DB_MAX_CONNS=8
      - DB_CONNECT_TIMEOUT=3s
      - DB_ACQUIRE_TIMEOUT=2s
      - DB_QUERY_TIMEOUT=5s
      - STARTUP_TIMEOUT=10s
      - REQUEST_TIMEOUT=8s
      - PROBE_TIMEOUT=2s
      - OTEL_ENABLED=false
