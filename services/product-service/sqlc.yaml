version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/postgres/sql/schema.sql"
    queries: "internal/postgres/sql/queries.sql"
    gen:
      go:
        package: "dbgen"
        out: "internal/postgres/dbgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
