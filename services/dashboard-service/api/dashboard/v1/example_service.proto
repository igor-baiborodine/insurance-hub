syntax = "proto3";

package dashboard.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/igor-baiborodine/insurance-hub/services/dashboard-service/gen/dashboard/v1;dashboardv1";

service ExampleService {
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {
      post: "/v1/example/echo"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      consumes: "application/json"
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "The unchanged Echo message."
          schema: {
            json_schema: {ref: ".dashboard.v1.EchoResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"message\":\"hello\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The request is invalid."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"invalid request\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "406"
        value: {
          description: "The requested response media type is not available."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"not acceptable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "413"
        value: {
          description: "The request body is too large."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":8,\"message\":\"request body too large\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "415"
        value: {
          description: "The request media type is not supported."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"unsupported media type\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "499"
        value: {
          description: "The request was canceled."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":1,\"message\":\"request canceled\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The request failed unexpectedly."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":13,\"message\":\"internal error\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "The RPC service is unavailable."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":14,\"message\":\"service unavailable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "504"
        value: {
          description: "The RPC deadline was exceeded."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":4,\"message\":\"deadline exceeded\",\"details\":[]}"
          }
        }
      }
    };
  }
}

message EchoRequest {
  string message = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 128
  }];
}

message EchoResponse {
  string message = 1;
}
