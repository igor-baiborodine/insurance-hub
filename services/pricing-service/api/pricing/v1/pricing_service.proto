syntax = "proto3";

package pricing.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/igor-baiborodine/insurance-hub/services/pricing-service/gen/pricing/v1;pricingv1";

// PricingService exposes the private quote calculation boundary.
service PricingService {
  // CalculatePrice returns one complete quote for the selected covers.
  rpc CalculatePrice(CalculatePriceRequest) returns (CalculatePriceResponse) {
    option (google.api.http) = {
      post: "/pricing/calculate"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      consumes: "application/json"
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "The Java-compatible numeric quote envelope."
          schema: {
            json_schema: {ref: ".pricing.v1.CalculatePriceHTTPResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"totalPrice\":78,\"coversPrices\":{\"C1\":26,\"C2\":52}}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The request is invalid."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"invalid request\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "406"
        value: {
          description: "The requested response media type is not available."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"not acceptable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "413"
        value: {
          description: "The request body is too large."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":8,\"message\":\"request body too large\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "415"
        value: {
          description: "The request media type is not supported."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"unsupported media type\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "499"
        value: {
          description: "The request was canceled."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":1,\"message\":\"request canceled\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The request failed unexpectedly."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":13,\"message\":\"internal error\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "The tariff store is unavailable."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":14,\"message\":\"service unavailable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "504"
        value: {
          description: "The request deadline was exceeded."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":4,\"message\":\"deadline exceeded\",\"details\":[]}"
          }
        }
      }
    };
  }
}

message CalculatePriceRequest {
  string product_code = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 64
  }];
  string policy_from = 2 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  string policy_to = 3 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  repeated string selected_covers = 4 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        min_bytes: 1
        max_bytes: 64
      }
    }
  }];
  repeated Answer answers = 5;
}

message Answer {
  string question_code = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 64
  }];
  oneof value {
    option (buf.validate.oneof).required = true;
    string text = 2;
    string number = 3 [(buf.validate.field).string = {pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"}];
  }
}

message CalculatePriceResponse {
  string total_price = 1;
  map<string, string> covers_prices = 2;
}

// CalculatePriceHTTPResponse is documentation-only; RPC amounts remain exact decimal strings.
message CalculatePriceHTTPResponse {
  double total_price = 1;
  map<string, double> covers_prices = 2;
}
