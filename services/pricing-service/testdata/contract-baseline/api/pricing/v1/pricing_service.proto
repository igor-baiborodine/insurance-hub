syntax = "proto3";

package pricing.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/igor-baiborodine/insurance-hub/services/pricing-service/gen/pricing/v1;pricingv1";

service PricingService {
  rpc CalculatePrice(CalculatePriceRequest) returns (CalculatePriceResponse);
}

message CalculatePriceRequest {
  string product_code = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 64
  }];
  string policy_from = 2 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  string policy_to = 3 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  repeated string selected_covers = 4 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        min_bytes: 1
        max_bytes: 64
      }
    }
  }];
  repeated Answer answers = 5;
}

message Answer {
  string question_code = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 64
  }];
  oneof value {
    option (buf.validate.oneof).required = true;
    string text = 2;
    string number = 3 [(buf.validate.field).string = {pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"}];
  }
}

message CalculatePriceResponse {
  string total_price = 1;
  map<string, string> covers_prices = 2;
}

message CalculatePriceHTTPResponse {
  double total_price = 1;
  map<string, double> covers_prices = 2;
}
