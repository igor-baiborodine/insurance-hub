syntax = "proto3";

package document.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/igor-baiborodine/insurance-hub/services/document-service/gen/document/v1;documentv1";

service DocumentService {
  rpc FindDocuments(FindDocumentsRequest) returns (FindDocumentsResponse) {
    option (google.api.http) = {get: "/documents/{policy_number}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "All retrievable documents for the exact policy number."
          schema: {
            json_schema: {ref: ".document.v1.FindDocumentsResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"documents\":[{\"policyNumber\":\"SYN-362\",\"content\":\"JVBERi0zNjI=\"}]}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The path is malformed."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"invalid request\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "429"
        value: {
          description: "The response budget or lookup concurrency limit was exceeded."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":8,\"message\":\"response limit exceeded\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "499"
        value: {
          description: "The request was canceled."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":1,\"message\":\"request canceled\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The request failed unexpectedly."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":13,\"message\":\"internal error\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "A required dependency is unavailable."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":14,\"message\":\"service unavailable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "504"
        value: {
          description: "The request deadline was exceeded."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":4,\"message\":\"deadline exceeded\",\"details\":[]}"
          }
        }
      }
    };
  }
}

message FindDocumentsRequest {
  string policy_number = 1 [(buf.validate.field).string = {min_len: 1}];
}

message FindDocumentsResponse {
  repeated Document documents = 1;
}

message Document {
  string policy_number = 1;
  bytes content = 2;
}
