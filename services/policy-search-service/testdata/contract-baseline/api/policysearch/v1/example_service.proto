syntax = "proto3";

package policysearch.v1;

import "buf/validate/validate.proto";

option go_package =
  "github.com/igor-baiborodine/insurance-hub/services/policy-search-service/gen/policysearch/v1;policysearchv1";

service ExampleService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 128
  }];
}

message EchoResponse {
  string message = 1;
}
