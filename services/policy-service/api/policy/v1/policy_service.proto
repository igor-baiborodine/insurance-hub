message CreateOfferRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {ref: ".policy.v1.CreateOfferHTTPRequest"}
  };
  string product_code = 1 [
    (google.api.field_visibility).restriction = "RPC",
    (buf.validate.field).string = {
      min_bytes: 1
      max_bytes: 64
    }
  ];
  string policy_from = 2 [
    (google.api.field_visibility).restriction = "RPC",
    (buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
  ];
  string policy_to = 3 [
    (google.api.field_visibility).restriction = "RPC",
    (buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
  ];
  repeated string selected_covers = 4 [
    (google.api.field_visibility).restriction = "RPC",
    (buf.validate.field).repeated = {
      min_items: 1
      items: {
        string: {
          min_bytes: 1
          max_bytes: 64
        }
      }
    }
  ];
  repeated OfferAnswer answers = 5 [(google.api.field_visibility).restriction = "RPC"];
}

// OfferAnswer is one typed questionnaire answer; the stored answer is limited to 255 characters.
message OfferAnswer {
  string question_code = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 64
  }];
  oneof value {
    option (buf.validate.oneof).required = true;
    string choice = 2 [(buf.validate.field).string.max_len = 255];
    string text = 3 [(buf.validate.field).string.max_len = 255];
    string number = 4 [(buf.validate.field).string = {
      max_len: 255
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
    }];
  }
}

message CreateOfferResponse {
  string offer_number = 1;
  string total_price = 2;
  map<string, string> covers_prices = 3;
}

// CreateOfferHTTPResponse is documentation-only; RPC amounts remain exact decimal strings.
message CreateOfferHTTPResponse {
  string offer_number = 1;
  double total_price = 2;
  map<string, double> covers_prices = 3;
}

// CreateOfferHTTPRequest is documentation-only: the HTTP body that the gateway maps to CreateOfferRequest.
message CreateOfferHTTPRequest {
  string product_code = 1;
  // Coverage start as a "YYYY-MM-DD" string or a [year, month, day] integer array.
  google.protobuf.Value policy_from = 2;
  // Coverage end as a "YYYY-MM-DD" string or a [year, month, day] integer array.
  google.protobuf.Value policy_to = 3;
  repeated string selected_covers = 4;
  repeated OfferHTTPAnswer answers = 5;
}

// OfferHTTPAnswer is documentation-only: one typed questionnaire answer in the HTTP body.
message OfferHTTPAnswer {
  // Answer variant: "choice", "text" or "numeric".
  string type = 1;
  string question_code = 2;
  // A JSON string for "choice" and "text" answers; a JSON number for "numeric" answers.
  google.protobuf.Value answer = 3;
}

message IssuePolicyRequest {
  string offer_number = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  PolicyHolder policy_holder = 2 [(buf.validate.field).required = true];
  // The authenticated agent; an empty login issues a policy without an agent.
  string agent_login = 3 [(buf.validate.field).string.max_len = 255];
}

// PolicyHolder is the insured person named on the policy.
message PolicyHolder {
  string first_name = 1 [(buf.validate.field).string.max_len = 255];
  string last_name = 2 [(buf.validate.field).string.max_len = 255];
  string tax_id = 3 [(buf.validate.field).string.max_len = 255];
}

message IssuePolicyResponse {
  string policy_number = 1;
}

message GetPolicyRequest {
  string policy_number = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message GetPolicyResponse {
  PolicyDetails policy = 1;
}

// GetPolicyHTTPResponse is documentation-only: the HTTP lookup response.
message GetPolicyHTTPResponse {
  PolicyDetailsHTTP policy = 1;
}

// PolicyDetailsHTTP is documentation-only: dates are [year, month, day] integer arrays and the
// premium is a JSON number with the stored scale.
message PolicyDetailsHTTP {
  string number = 1;
  repeated int32 date_from = 2;
  repeated int32 date_to = 3;
  string policy_holder = 4;
  double total_premium = 5;
  string product_code = 6;
  string account_number = 7;
  repeated string covers = 8;
}

// PolicyDetails describes a policy's latest version. Dates are "YYYY-MM-DD" text and the
// premium is an exact decimal string; each cover is formatted as "code - price".
message PolicyDetails {
  string number = 1;
  string date_from = 2;
  string date_to = 3;
  string policy_holder = 4;
  string total_premium = 5;
  string product_code = 6;
  string account_number = 7;
  repeated string covers = 8;
}

message TerminatePolicyRequest {
  string policy_number = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message TerminatePolicyResponse {
  string policy_number = 1;
}
