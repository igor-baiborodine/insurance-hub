syntax = "proto3";

package policy.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/igor-baiborodine/insurance-hub/services/policy-service/gen/policy/v1;policyv1";

service ExampleService {
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {
      post: "/v1/example/echo"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      consumes: "application/json"
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "The unchanged Echo message."
          schema: {
            json_schema: {ref: ".policy.v1.EchoResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"message\":\"hello\"}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The request is invalid."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"invalid request\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "406"
        value: {
          description: "The requested response media type is not available."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"not acceptable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "413"
        value: {
          description: "The request body is too large."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":8,\"message\":\"request body too large\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "415"
        value: {
          description: "The request media type is not supported."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"unsupported media type\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "499"
        value: {
          description: "The request was canceled."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":1,\"message\":\"request canceled\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The request failed unexpectedly."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":13,\"message\":\"internal error\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "The RPC service is unavailable."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":14,\"message\":\"service unavailable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "504"
        value: {
          description: "The RPC deadline was exceeded."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":4,\"message\":\"deadline exceeded\",\"details\":[]}"
          }
        }
      }
    };
  }
}

// PolicyService exposes the private offer boundary.
service PolicyService {
  // CreateOffer checks the product, prices the selected covers and stores a new offer.
  rpc CreateOffer(CreateOfferRequest) returns (CreateOfferResponse) {
    option (google.api.http) = {
      post: "/offers"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      consumes: "application/json"
      produces: "application/json"
      responses: {
        key: "200"
        value: {
          description: "The stored offer with numeric total and cover prices."
          schema: {
            json_schema: {ref: ".policy.v1.CreateOfferHTTPResponse"}
          }
          examples: {
            key: "application/json"
            value: "{\"offerNumber\":\"8f0e2c1a-5b7d-4e3f-9a6c-2d1b0e9f8a7c\",\"totalPrice\":78,\"coversPrices\":{\"C1\":26,\"C2\":52}}"
          }
        }
      }
      responses: {
        key: "400"
        value: {
          description: "The request or the quote input is invalid."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"invalid request\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "404"
        value: {
          description: "The product does not exist."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":5,\"message\":\"not found\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "406"
        value: {
          description: "The requested response media type is not available."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"not acceptable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "413"
        value: {
          description: "The request body is too large."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":8,\"message\":\"request body too large\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "415"
        value: {
          description: "The request media type is not supported."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":3,\"message\":\"unsupported media type\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "499"
        value: {
          description: "The request was canceled."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":1,\"message\":\"request canceled\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "500"
        value: {
          description: "The request failed unexpectedly."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":13,\"message\":\"internal error\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "503"
        value: {
          description: "Product, Pricing or offer storage is unavailable."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":14,\"message\":\"service unavailable\",\"details\":[]}"
          }
        }
      }
      responses: {
        key: "504"
        value: {
          description: "A deadline was exceeded."
          schema: {
            json_schema: {ref: ".google.rpc.Status"}
          }
          examples: {
            key: "application/json"
            value: "{\"code\":4,\"message\":\"deadline exceeded\",\"details\":[]}"
          }
        }
      }
    };
  }
}

message EchoRequest {
  string message = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 128
  }];
}

message EchoResponse {
  string message = 1;
}

message CreateOfferRequest {
  string product_code = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 64
  }];
  string policy_from = 2 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  string policy_to = 3 [(buf.validate.field).string = {pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}];
  repeated string selected_covers = 4 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {
        min_bytes: 1
        max_bytes: 64
      }
    }
  }];
  repeated OfferAnswer answers = 5;
}

// OfferAnswer keeps the legacy answer variant; the stored answer is limited to 255 characters.
message OfferAnswer {
  string question_code = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 64
  }];
  oneof value {
    option (buf.validate.oneof).required = true;
    string choice = 2 [(buf.validate.field).string.max_len = 255];
    string text = 3 [(buf.validate.field).string.max_len = 255];
    string number = 4 [(buf.validate.field).string = {
      max_len: 255
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
    }];
  }
}

message CreateOfferResponse {
  string offer_number = 1;
  string total_price = 2;
  map<string, string> covers_prices = 3;
}

// CreateOfferHTTPResponse is documentation-only; RPC amounts remain exact decimal strings.
message CreateOfferHTTPResponse {
  string offer_number = 1;
  double total_price = 2;
  map<string, double> covers_prices = 3;
}
