name: Go Library Release

on:
  push:
    branches:
      - main
    paths:
      - 'libs/servicekit/**'

permissions:
  contents: read

concurrency:
  group: go-library-release-servicekit
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  plan:
    name: Plan Go library release validation
    if: github.repository == 'igor-baiborodine/insurance-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Plan exact-source module validation
        id: plan
        run: make go-library-release-plan

  validate:
    name: Validate release module (${{ matrix.module }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Set up module Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Validate exact-source module obligations
        env:
          MODULE_DIR: ${{ matrix.module }}
        run: make go-library-release-validate

  publish:
    name: Publish Go library release
    needs: [plan, validate]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'

      - name: Calculate next scoped library version
        id: monotag
        shell: bash
        run: |
          set -euo pipefail
          metadata_dir="$RUNNER_TEMP/servicekit-release"
          mkdir -p "$metadata_dir"
          npx -y monotag@1.26.0 tag \
            --repo-dir . \
            --path libs/servicekit \
            --prefix libs/servicekit/v \
            --tag-file "$metadata_dir/tag.txt" \
            --version-file "$metadata_dir/version.txt" \
            --notes-file "$metadata_dir/notes.md" \
            --min-version 1.0.0 \
            --max-version 1.999.999
          release_tag="$(cat "$metadata_dir/tag.txt")"
          release_version="$(cat "$metadata_dir/version.txt")"
          [[ "$release_version" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$release_tag" == "libs/servicekit/v$release_version" ]]
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=v$release_version" >> "$GITHUB_OUTPUT"
          echo "notes=$metadata_dir/notes.md" >> "$GITHUB_OUTPUT"

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Set up selected Go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: libs/servicekit/go.mod
          cache: false

      - name: Prepare validated release identity
        env:
          RELEASE_VERSION: ${{ steps.monotag.outputs.version }}
        run: make go-library-release-prepare

      - name: Create scoped library source tag
        env:
          RELEASE_VERSION: ${{ steps.monotag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: make go-library-release-tag

      - name: Verify public module resolution and builds
        env:
          RELEASE_VERSION: ${{ steps.monotag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: make go-library-release-verify

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: false
          draft: false
          makeLatest: true
          name: ${{ steps.monotag.outputs.tag }}
          tag: ${{ steps.monotag.outputs.tag }}
          bodyFile: ${{ steps.monotag.outputs.notes }}
          token: ${{ secrets.GITHUB_TOKEN }}
