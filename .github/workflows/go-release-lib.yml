name: Go Library Release

on:
  push:
    branches:
      - main
    paths:
      - 'libs/servicekit/**'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: go-library-release-servicekit
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Validate Go library release
    if: github.repository == 'igor-baiborodine/insurance-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.monotag.outputs.version }}
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'

      - name: Calculate next scoped library version
        id: monotag
        shell: bash
        run: |
          set -euo pipefail
          metadata_dir="$RUNNER_TEMP/servicekit-release"
          mkdir -p "$metadata_dir"
          npx -y monotag@1.26.0 tag \
            --repo-dir . \
            --path libs/servicekit \
            --prefix libs/servicekit/v \
            --tag-file "$metadata_dir/tag.txt" \
            --version-file "$metadata_dir/version.txt" \
            --notes-file "$metadata_dir/notes.md" \
            --min-version 0.1.0 \
            --max-version 0.999.999
          release_tag="$(cat "$metadata_dir/tag.txt")"
          release_version="$(cat "$metadata_dir/version.txt")"
          [[ "$release_version" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          [[ "$release_tag" == "libs/servicekit/v$release_version" ]]
          echo "version=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Set up selected Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: libs/servicekit/go.mod
          cache: false

      - name: Validate merged library source and consumers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.monotag.outputs.version }}
        run: make go-library-release-validate

      - name: Upload library validation results
        uses: actions/upload-artifact@v6
        with:
          name: library-validation
          path: .work/servicekit/validation.json
          if-no-files-found: error
          include-hidden-files: true

  publish-tag:
    name: Publish Go library tag
    needs: validate
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Download library validation results
        uses: actions/download-artifact@v6
        with:
          name: library-validation
          path: .work/servicekit

      - name: Create scoped library source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: make go-library-release-tag

  verify:
    name: Verify published Go library
    needs: [validate, publish-tag]
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Set up selected Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: libs/servicekit/go.mod
          cache: false

      - name: Download library validation results
        uses: actions/download-artifact@v6
        with:
          name: library-validation
          path: .work/servicekit

      - name: Verify public module resolution and builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: make go-library-release-verify

      - name: Upload library qualification record
        uses: actions/upload-artifact@v6
        with:
          name: library-qualification
          path: .work/servicekit/qualification.json
          if-no-files-found: error
          include-hidden-files: true

  publish-notes:
    name: Publish Go library release
    needs: [validate, verify]
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Download library validation results
        uses: actions/download-artifact@v6
        with:
          name: library-validation
          path: .work/servicekit

      - name: Download library qualification record
        uses: actions/download-artifact@v6
        with:
          name: library-qualification
          path: .work/servicekit

      - name: Attest library qualification record
        uses: actions/attest@v4
        with:
          subject-path: .work/servicekit/qualification.json

      - name: Create qualified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make go-library-release-publish
