name: Legacy API and Service PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'legacy/**'

permissions:
  contents: read
  packages: read

jobs:
  validate-and-build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Detect changed legacy module
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .venv/bin/python scripts/legacy/release.py select pr --before "origin/$BASE_REF" --after HEAD --output "$GITHUB_OUTPUT"

      - name: Set up Java 14
        if: steps.detect.outputs.module != ''
        uses: actions/setup-java@v5
        with:
          java-version: '14'
          distribution: 'zulu'
          cache: 'maven'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build module
        if: steps.detect.outputs.module != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE_PATH="${{ steps.detect.outputs.module_path }}"
          # Only package without publishing or testing
          mvn -f "$MODULE_PATH/pom.xml" clean package \
            -s "${{ github.workspace }}/settings.xml"
