name: Product Security Boundary Validation

on:
  push:
    branches:
      - main
    paths:
      - 'legacy/agent-portal-gateway/**'
      - 'legacy/auth-service/**'
      - 'legacy/product-service/**'
      - 'legacy/product-service-api/**'
      - 'services/product-service/**'
      - 'scripts/product-baseline/**'
      - 'scripts/product-security/**'
      - 'scripts/go/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/workflows/product-security.yml'
      - '.github/workflows/legacy-pr-api-svc.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'legacy/agent-portal-gateway/**'
      - 'legacy/auth-service/**'
      - 'legacy/product-service/**'
      - 'legacy/product-service-api/**'
      - 'services/product-service/**'
      - 'scripts/product-baseline/**'
      - 'scripts/product-security/**'
      - 'scripts/go/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'Makefile'
      - '.github/workflows/product-security.yml'
      - '.github/workflows/legacy-pr-api-svc.yml'

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 14 and Maven package access
        uses: actions/setup-java@v5
        with:
          java-version: '14'
          distribution: 'zulu'
          cache: 'maven'
          server-id: 'github'
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'

      - name: Set up Go 1.27.2
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: services/product-service/go.sum

      - name: Verify host prerequisites
        run: |
          docker info
          jq --version
          python3 --version
          mvn --version

      - name: Bootstrap pinned Product tools
        run: make go-product-bootstrap-tools

      - name: Prove controlled security gate failures
        run: make product-security-test-tooling

      - name: Run access and combined security checks
        run: make product-security-check
