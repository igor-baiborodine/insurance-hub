name: Go Report Card

on:
  push:
    branches:
      - main
    paths:
      - 'libs/servicekit/**'
      - '**/*-service/**/*.go'
      - '**/*-service/go.mod'
      - '**/*-service/go.sum'
      - '**/*-service/.golangci.yml'
      - '**/*-service/buf.yaml'
      - '**/*-service/buf.lock'
      - '**/*-service/buf.gen.yaml'
      - '**/*-service/sqlc.yaml'
      - '**/*-service/api/**/*.proto'
      - '**/*-service/gen/openapiv2/**/*.json'
      - '**/*-service/internal/postgres/sql/*.sql'
      - '**/*-service/**/testdata/**'
      - '!legacy/**'
      - '!services/*/*-service/**'
      - '!templates/*/*-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'libs/servicekit/**'
      - '**/*-service/**/*.go'
      - '**/*-service/go.mod'
      - '**/*-service/go.sum'
      - '**/*-service/.golangci.yml'
      - '**/*-service/buf.yaml'
      - '**/*-service/buf.lock'
      - '**/*-service/buf.gen.yaml'
      - '**/*-service/sqlc.yaml'
      - '**/*-service/api/**/*.proto'
      - '**/*-service/gen/openapiv2/**/*.json'
      - '**/*-service/internal/postgres/sql/*.sql'
      - '**/*-service/**/testdata/**'
      - '!legacy/**'
      - '!services/*/*-service/**'
      - '!templates/*/*-service/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-card:
    name: Check Go module report cards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Insurance Hub
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout archived Go Report Card CLI
        uses: actions/checkout@v6
        with:
          repository: gojp/goreportcard
          ref: af15decf135bcd0a1bfa12180d027bdeb19f601c
          path: .tools/goreportcard
          persist-credentials: false

      - name: Set up Go 1.27.4
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Install archived report checks
        run: make -C .tools/goreportcard install

      - name: Check registered services, shared libraries, and scaffold
        run: |
          report_card_bin="$(dirname "$(command -v go)")"
          ./.venv/bin/python scripts/go/report_card.py \
            --workspace "$GITHUB_WORKSPACE" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report-card-root "$GITHUB_WORKSPACE/.tools/goreportcard" \
            --go-bin "$report_card_bin" \
            --topology "$GITHUB_WORKSPACE/go-module-topology.json"
