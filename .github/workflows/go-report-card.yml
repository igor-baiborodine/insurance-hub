name: Go Report Card

on:
  push:
    branches:
      - main
    paths:
      - 'templates/go-service/**/*.go'
      - 'templates/go-service/go.mod'
      - 'templates/go-service/go.sum'
      - 'templates/go-service/.golangci.yml'
      - 'templates/go-service/buf.yaml'
      - 'templates/go-service/buf.lock'
      - 'templates/go-service/buf.gen.yaml'
      - 'templates/go-service/api/**/*.proto'
      - 'templates/go-service/**/testdata/**'
      - 'services/*-service/**/*.go'
      - 'services/*-service/go.mod'
      - 'services/*-service/go.sum'
      - 'services/*-service/.golangci.yml'
      - 'services/*-service/buf.yaml'
      - 'services/*-service/buf.lock'
      - 'services/*-service/buf.gen.yaml'
      - 'services/*-service/sqlc.yaml'
      - 'services/*-service/api/**/*.proto'
      - 'services/*-service/internal/postgres/sql/*.sql'
      - 'services/*-service/**/testdata/**'
  pull_request:
    branches:
      - main
    paths:
      - 'templates/go-service/**/*.go'
      - 'templates/go-service/go.mod'
      - 'templates/go-service/go.sum'
      - 'templates/go-service/.golangci.yml'
      - 'templates/go-service/buf.yaml'
      - 'templates/go-service/buf.lock'
      - 'templates/go-service/buf.gen.yaml'
      - 'templates/go-service/api/**/*.proto'
      - 'templates/go-service/**/testdata/**'
      - 'services/*-service/**/*.go'
      - 'services/*-service/go.mod'
      - 'services/*-service/go.sum'
      - 'services/*-service/.golangci.yml'
      - 'services/*-service/buf.yaml'
      - 'services/*-service/buf.lock'
      - 'services/*-service/buf.gen.yaml'
      - 'services/*-service/sqlc.yaml'
      - 'services/*-service/api/**/*.proto'
      - 'services/*-service/internal/postgres/sql/*.sql'
      - 'services/*-service/**/testdata/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-card:
    name: Check Go module report cards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Insurance Hub
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout archived Go Report Card CLI
        uses: actions/checkout@v6
        with:
          repository: gojp/goreportcard
          ref: af15decf135bcd0a1bfa12180d027bdeb19f601c
          path: .tools/goreportcard
          persist-credentials: false

      - name: Set up Go 1.27.2
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Install archived report checks
        run: make -C .tools/goreportcard install

      - name: Check Product Service and service scaffold
        run: |
          report_card_bin="$(dirname "$(command -v go)")"
          ./.venv/bin/python scripts/go/report_card.py \
            --workspace "$GITHUB_WORKSPACE" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report-card-root "$GITHUB_WORKSPACE/.tools/goreportcard" \
            --go-bin "$report_card_bin" \
            services/product-service templates/go-service
