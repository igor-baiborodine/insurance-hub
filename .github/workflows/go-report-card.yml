name: Go Report Card

on:
  push:
    branches:
      - main
    paths:
      - 'services/product-service/**'
      - 'templates/go-service/**'
      - '.github/workflows/go-report-card.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/product-service/**'
      - 'templates/go-service/**'
      - '.github/workflows/go-report-card.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-card:
    name: Check Go module report cards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Insurance Hub
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout archived Go Report Card CLI
        uses: actions/checkout@v6
        with:
          repository: gojp/goreportcard
          ref: af15decf135bcd0a1bfa12180d027bdeb19f601c
          path: .tools/goreportcard
          persist-credentials: false

      - name: Set up Go 1.27.2
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Install archived report checks
        run: make -C .tools/goreportcard install

      - name: Check Product Service and service scaffold
        env:
          REPORT_CARD_BIN: ${{ steps.setup-go.outputs.go-bin-path }}
        run: >-
          ./.venv/bin/python scripts/go/report_card.py
          --workspace "$GITHUB_WORKSPACE"
          --summary "$GITHUB_STEP_SUMMARY"
          --report-card-root "$GITHUB_WORKSPACE/.tools/goreportcard"
          --go-bin "$REPORT_CARD_BIN"
          services/product-service templates/go-service
