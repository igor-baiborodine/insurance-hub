name: Go Module Validation

on:
  push:
    branches:
      - main
    paths:
      - 'templates/go-service/**'
      - 'services/product-service/**'
      - 'legacy/product-service/src/test/resources/product-read-baseline/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '**/go.work'
      - '**/go.work.sum'
      - 'go-module-topology.json'
      - 'scripts/go/**'
      - 'scripts/postgres/**'
      - 'scripts/product-deployment/**'
      - 'scripts/product-baseline/**'
      - 'scripts/product-security/**'
      - 'k8s/apps/svc/**'
      - 'k8s/overlays/local-dev/svc/**'
      - 'k8s/overlays/qa/svc/**'
      - 'k8s/flux/qa/**'
      - 'k8s/Makefile'
      - 'docs/migration/phase-4/go-module-topology.md'
      - 'docs/migration/phase-4/product-service/README.md'
      - 'docs/migration/phase-4/product-service/**'
      - '.github/workflows/go-modules.yml'
      - '.github/workflows/go-release-svc.yml'
      - 'codecov.yml'
      - 'Makefile'
  pull_request:
    branches:
      - main
    paths:
      - 'templates/go-service/**'
      - 'services/product-service/**'
      - 'legacy/product-service/src/test/resources/product-read-baseline/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '**/go.work'
      - '**/go.work.sum'
      - 'go-module-topology.json'
      - 'scripts/go/**'
      - 'scripts/postgres/**'
      - 'scripts/product-deployment/**'
      - 'scripts/product-baseline/**'
      - 'scripts/product-security/**'
      - 'k8s/apps/svc/**'
      - 'k8s/overlays/local-dev/svc/**'
      - 'k8s/overlays/qa/svc/**'
      - 'k8s/flux/qa/**'
      - 'k8s/Makefile'
      - 'docs/migration/phase-4/go-module-topology.md'
      - 'docs/migration/phase-4/product-service/README.md'
      - 'docs/migration/phase-4/product-service/**'
      - '.github/workflows/go-modules.yml'
      - '.github/workflows/go-release-svc.yml'
      - 'codecov.yml'
      - 'Makefile'

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Validate Go module topology and services
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'

      - name: Set up Go 1.27.2
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: |
            templates/go-service/go.sum
            services/product-service/go.sum

      - name: Set up Java 14 and Maven package access
        uses: actions/setup-java@v5
        with:
          java-version: '14'
          distribution: 'zulu'
          cache: 'maven'
          server-id: 'github'
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Bootstrap pinned scaffold tools
        run: make go-scaffold-bootstrap-tools

      - name: Bootstrap pinned Product tools
        run: make go-product-bootstrap-tools

      - name: Bootstrap pinned Product CI helpers
        run: |
          make -C services/product-service bootstrap-ci-tools
          echo "$GITHUB_WORKSPACE/services/product-service/.tools/bin" >> "$GITHUB_PATH"

      - name: Resolve formatting scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            candidate="$PR_BASE"
            source_name="pull-request base"
          else
            candidate="$PUSH_BEFORE"
            source_name="push before"
          fi

          if [[ -n "$candidate" && ! "$candidate" =~ ^0+$ ]] &&
            git cat-file -e "${candidate}^{commit}" 2>/dev/null
          then
            echo "FORMAT_SCOPE=changed" >> "$GITHUB_ENV"
            echo "FORMAT_BASE=$candidate" >> "$GITHUB_ENV"
            echo "Using $source_name commit $candidate for changed-file formatting."
          else
            echo "FORMAT_SCOPE=all" >> "$GITHUB_ENV"
            echo "FORMAT_BASE=" >> "$GITHUB_ENV"
            echo "No resolvable nonzero $source_name commit; using FORMAT_SCOPE=all."
          fi

      - name: Run non-mutating module checks
        run: make go-modules-check FORMAT_SCOPE="$FORMAT_SCOPE" FORMAT_BASE="$FORMAT_BASE"

      - name: Prove controlled topology failures
        run: make go-topology-test

      - name: Prove controlled scaffold tooling failures
        run: make go-scaffold-test-tooling

      - name: Prove controlled Product tooling failures
        run: make go-product-test-tooling

      - name: Prove renamed scaffold copy
        run: make go-scaffold-check-copy

      - name: Check generic release and Product deployment tooling
        run: |
          make -C services/product-service check-ci
          make go-svc-release-test
          make go-svc-dispatch-test
          make go-svc-deploy-check SVC_NAME=product
          make go-svc-deploy-test-tooling SVC_NAME=product

      - name: Verify Product reader and baseline tooling
        run: |
          make postgres-svc-role-test
          make product-baseline-fixtures-check
          make product-baseline-test BASELINE_SUITE=db-permissions

      - name: Validate the Product runtime image
        run: make go-svc-image-check SVC_NAME=product

      - name: Check Product Service coverage (minimum 75%)
        run: make -C services/product-service coverage-check

      - name: Upload Product Service coverage to Codecov
        if: ${{ always() && hashFiles('services/product-service/coverage.txt') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/product-service/coverage.txt
          flags: product-service
          name: product-service
          disable_search: true
          fail_ci_if_error: true
