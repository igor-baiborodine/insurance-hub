name: Go Service Release

on:
  push:
    branches:
      - main
    paths:
      - 'services/*-service/Dockerfile'
      - 'services/*-service/.dockerignore'
      - 'services/*-service/go.mod'
      - 'services/*-service/go.sum'
      - 'services/*-service/cmd/**'
      - 'services/*-service/gen/**'
      - 'services/*-service/internal/**'
      - '!services/*-service/**/*_test.go'
      - '!services/*-service/internal/testing/**'
      - '!services/*-service/internal/postgres/sql/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: go-service-release
  cancel-in-progress: false

jobs:
  release:
    name: Release changed Go service
    if: github.repository == 'igor-baiborodine/insurance-hub'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout triggering source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24.13.0
        uses: actions/setup-node@v6
        with:
          node-version: '24.13.0'

      - name: Set up uv 0.13.1
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: true

      - name: Set up managed Python 3.14.8
        run: make python-toolchain-setup

      - name: Select exactly one standard Go service
        id: service
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_AFTER: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: make go-svc-release-select RELEASE_OUTPUT="$GITHUB_OUTPUT"

      - name: Calculate next scoped service version
        id: monotag
        shell: bash
        env:
          MODULE_NAME: ${{ steps.service.outputs.module }}
          MODULE_PATH: ${{ steps.service.outputs.module_path }}
        run: |
          set -euo pipefail
          metadata_dir="$RUNNER_TEMP/go-service-release"
          mkdir -p "$metadata_dir"

          npx -y monotag tag \
            --repo-dir . \
            --path "$MODULE_PATH" \
            --prefix "$MODULE_NAME/v" \
            --tag-file "$metadata_dir/tag.txt" \
            --version-file "$metadata_dir/version.txt" \
            --notes-file "$metadata_dir/notes.md" \
            --min-version 1.0.0 \
            --max-version 1.999.999

          release_tag="$(cat "$metadata_dir/tag.txt")"
          release_version="$(cat "$metadata_dir/version.txt")"
          [[ "$release_version" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$release_tag" == "$MODULE_NAME/v$release_version" ]]
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "notes=$metadata_dir/notes.md" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build once and push semantic and source tags
        id: image
        shell: bash
        env:
          MODULE_PATH: ${{ steps.service.outputs.module_path }}
          RELEASE_IMAGE: ${{ steps.service.outputs.registry_image }}
          RELEASE_VERSION: ${{ steps.monotag.outputs.version }}
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short "$SOURCE_REVISION")"
          source_created="$(git show -s --format=%cI "$SOURCE_REVISION")"
          source_version="git-${SOURCE_REVISION:0:12}"
          image="$RELEASE_IMAGE"

          docker build \
            --build-arg "SOURCE_CREATED=$source_created" \
            --build-arg "SOURCE_REPOSITORY=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" \
            --build-arg "SOURCE_VERSION=$source_version" \
            --tag "$image:$RELEASE_VERSION" \
            --tag "$image:sha-$short_sha" \
            --file "$MODULE_PATH/Dockerfile" \
            "$MODULE_PATH"

          docker push "$image:$RELEASE_VERSION"
          docker push "$image:sha-$short_sha"
          image_digest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Create scoped source tag
        env:
          MODULE_NAME: ${{ steps.service.outputs.module }}
          RELEASE_TAG: ${{ steps.monotag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.monotag.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $MODULE_NAME $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"

      - name: Prepare and commit configured release targets
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SERVICE: ${{ steps.service.outputs.service }}
          RELEASE_VERSION: ${{ steps.monotag.outputs.version }}
          RELEASE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_paths="$RUNNER_TEMP/go-service-release/paths"
          make go-svc-release-prepare RELEASE_OUTPUT="$release_paths"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --pathspec-from-file="$release_paths" --pathspec-file-nul
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Configured release targets already use $RELEASE_VERSION."
          else
            git commit -m "chore(k8s): update $RELEASE_SERVICE Go release to $RELEASE_VERSION"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: false
          draft: false
          makeLatest: true
          name: ${{ steps.monotag.outputs.tag }}
          tag: ${{ steps.monotag.outputs.tag }}
          bodyFile: ${{ steps.monotag.outputs.notes }}
          token: ${{ secrets.GITHUB_TOKEN }}
