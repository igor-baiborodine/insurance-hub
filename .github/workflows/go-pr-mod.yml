name: Go PR Module Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'templates/go-service/**/*.go'
      - 'templates/go-service/go.mod'
      - 'templates/go-service/go.sum'
      - 'templates/go-service/.golangci.yml'
      - 'templates/go-service/buf.yaml'
      - 'templates/go-service/buf.lock'
      - 'templates/go-service/buf.gen.yaml'
      - 'templates/go-service/api/**/*.proto'
      - 'templates/go-service/testdata/contract-baseline/**'
      - 'services/*-service/**/*.go'
      - 'services/*-service/go.mod'
      - 'services/*-service/go.sum'
      - 'services/*-service/.golangci.yml'
      - 'services/*-service/buf.yaml'
      - 'services/*-service/buf.lock'
      - 'services/*-service/buf.gen.yaml'
      - 'services/*-service/sqlc.yaml'
      - 'services/*-service/api/**/*.proto'
      - 'services/*-service/internal/postgres/sql/*.sql'
      - 'services/*-service/testdata/contract-baseline/**'

permissions:
  contents: read

concurrency:
  group: go-pr-mod-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate selected Go module
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Select Go module
        id: select
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git cat-file -e "${PR_BASE}^{commit}"
          git cat-file -e "${PR_HEAD}^{commit}"

          declare -A selected=()
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              templates/go-service/*)
                selected[templates/go-service]=1
                ;;
              services/*)
                service_path=${changed_path#services/}
                service_name=${service_path%%/*}
                if [[ "$service_name" == *-service && "$service_path" == */* ]]; then
                  selected["services/$service_name"]=1
                fi
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT -z "$PR_BASE" "$PR_HEAD")

          mapfile -t modules < <(printf '%s\n' "${!selected[@]}" | sed '/^$/d' | sort)
          if (( ${#modules[@]} == 0 )); then
            echo 'No supported Go module is present in the complete pull request diff; validation is a no-op.'
            echo 'module_dir=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( ${#modules[@]} > 1 )); then
            printf 'Multiple Go modules changed; split the pull request:' >&2
            printf ' %s' "${modules[@]}" >&2
            printf '\n' >&2
            exit 1
          fi

          module_dir=${modules[0]}
          case "$module_dir" in
            templates/go-service)
              module_role='service-scaffold'
              ;;
            services/*-service)
              module_role='business-service'
              ;;
            *)
              echo "Unsupported Go module: $module_dir" >&2
              exit 1
              ;;
          esac

          module_key=${module_dir//\//-}
          coverage_file="$module_dir/coverage.txt"
          coverage_flag=${module_dir##*/}
          {
            echo "module_dir=$module_dir"
            echo "module_key=$module_key"
            echo "module_role=$module_role"
            echo "go_sum=$module_dir/go.sum"
            echo 'validation_target=check-go-pr'
            echo "coverage_file=$coverage_file"
            echo "coverage_flag=$coverage_flag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go 1.27.2
        if: steps.select.outputs.module_dir != ''
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: ${{ steps.select.outputs.go_sum }}

      - name: Restore selected module validation tools
        if: steps.select.outputs.module_dir != ''
        uses: actions/cache@v5
        with:
          path: ${{ steps.select.outputs.module_dir }}/.tools
          key: >-
            go-pr-tools-${{ runner.os }}-1.27.2-${{ steps.select.outputs.module_key }}-${{
            hashFiles(format('{0}/Makefile', steps.select.outputs.module_dir),
            'scripts/go/module/common.mk') }}

      - name: Bootstrap and verify selected module tools
        if: steps.select.outputs.module_dir != ''
        env:
          MODULE_DIR: ${{ steps.select.outputs.module_dir }}
        run: make -C "$MODULE_DIR" bootstrap-go-tools

      - name: Run selected module validation
        if: steps.select.outputs.module_dir != ''
        env:
          COVERAGE_FILE: ${{ steps.select.outputs.coverage_file }}
          MODULE_DIR: ${{ steps.select.outputs.module_dir }}
          MODULE_ROLE: ${{ steps.select.outputs.module_role }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          VALIDATION_TARGET: ${{ steps.select.outputs.validation_target }}
        run: |
          set -euo pipefail
          if [[ "$MODULE_ROLE" != 'service-scaffold' ]]; then
            rm -f -- "$COVERAGE_FILE"
          fi
          make -C "$MODULE_DIR" "$VALIDATION_TARGET" \
            FORMAT_SCOPE=changed FORMAT_BASE="$PR_BASE"

      - name: Upload selected module coverage to Codecov
        if: >-
          success() && steps.select.outputs.module_dir != '' &&
          steps.select.outputs.module_role != 'service-scaffold'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.select.outputs.coverage_file }}
          flags: ${{ steps.select.outputs.coverage_flag }}
          name: ${{ steps.select.outputs.coverage_flag }}
          disable_search: true
          fail_ci_if_error: true
