[project]
name = "insurance-hub-tooling"
version = "0.0.0"
description = "Development dependencies for Insurance Hub auxiliary Python tooling"
requires-python = "==3.14.8"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.13.1"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "**/.tools/**",
    "**/.venv/**",
    "**/node_modules/**",
    "**/testdata/**",
    "legacy/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "check_monitoring",
    "deployment",
    "monitoring_assets",
    "release",
    "test_monitoring",
]
