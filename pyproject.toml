[project]
name = "insurance-hub-tooling"
version = "0.0.0"
description = "Development dependencies for Insurance Hub auxiliary Python tooling"
requires-python = "==3.14.8"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = "==0.13.1"

[tool.ruff]
target-version = "py314"
line-length = 100
force-exclude = true
extend-exclude = [
    "**/.tools/**",
    "**/.venv/**",
    "**/node_modules/**",
    "**/testdata/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "alloy_runtime",
    "build",
    "backend_ingestion",
    "check_backend_config",
    "check_config",
    "check_upstream_sync",
    "check_copy",
    "check_access_results",
    "check_cases",
    "check_ci",
    "check_docs",
    "check_ai_framework",
    "check_java_results",
    "check_render",
    "compare_http",
    "deployment_lifecycle",
    "disposable_acceptance",
    "disposable_acceptance_phase",
    "check_monitoring",
    "deployment",
    "example_cli",
    "legacy_process",
    "markdown_pre_commit",
    "markdown_toc",
    "monitoring_assets",
    "monitoring_integration",
    "monitoring_runtime",
    "module_tooling",
    "process_runner",
    "prepare",
    "report_card",
    "release",
    "resolve",
    "scaffold_process",
    "select_pr_module",
    "test_tooling",
    "tooling_runner",
    "topology",
    "validate_selection",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["ai/framework/examples/python-testing/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["ai/framework/examples/python-testing", "ai/framework/tools"]
markers = [
    "integration: explicitly selected tests using disposable external boundaries",
    "acceptance: explicitly selected full acceptance workflows",
]
