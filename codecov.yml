coverage:
  range: "50...75"
  status:
    patch:
      default:
        informational: true

flag_management:
  default_rules:
    carryforward: false
    statuses:
      - type: project
        target: 75%
        threshold: 0%
  individual_flags:
    - name: product-service
      paths:
        - services/product-service/

ignore:
  - "services/product-service/gen/**"
  - "services/product-service/internal/postgres/dbgen/**"
  - "services/product-service/internal/testing/**"
