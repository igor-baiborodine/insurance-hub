coverage:
  range: "50...75"
  status:
    patch:
      default:
        target: 75%
        threshold: 0%

flag_management:
  default_rules:
    carryforward: false
    statuses:
      - type: project
        target: 75%
        threshold: 0%
  individual_flags:
    - name: servicekit
      paths:
        - libs/servicekit/
    - name: product-service
      paths:
        - services/product-service/
    - name: policy-search-service
      paths:
        - services/policy-search-service/
    - name: dashboard-service
      paths:
        - services/dashboard-service/

ignore:
  - "services/product-service/gen/**"
  - "services/product-service/internal/postgres/dbgen/**"
  - "services/product-service/internal/testing/**"
  - "services/policy-search-service/gen/**"
  - "services/policy-search-service/internal/testing/**"
  - "services/dashboard-service/gen/**"
  - "services/dashboard-service/internal/testing/**"
